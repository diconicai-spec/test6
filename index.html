<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디코닉 차량 색상농도 확인 3D - Glass Gap Sort Fix v2</title>

    <style>
        :root {
            --primary-color: #172033;
            --accent-color: #2563eb;
            --bg-color: #f3f0ea;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-solid: #ffffff;
            --text-main: #20242c;
            --text-muted: #7c828d;
            --border-color: rgba(32, 36, 44, 0.10);
            --soft-bg: rgba(255,255,255,0.68);
            --shadow-soft: 0 18px 50px rgba(31, 35, 42, 0.10);
            --shadow-card: 0 12px 34px rgba(31, 35, 42, 0.09);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 26px;
            background:
                radial-gradient(circle at 38% 12%, rgba(255,255,255,0.96) 0, rgba(255,255,255,0.62) 24%, rgba(243,240,234,0) 50%),
                linear-gradient(180deg, #f7f5f1 0%, #efede8 100%);
        }

        .container {
            max-width: 1540px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            gap: 26px;
            align-items: start;
        }

        .left-panel {
            min-width: 0;
            position: relative;
        }

        .header-title {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            padding: 0 6px;
        }

        .header-title > div:first-child {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(25px, 2vw, 34px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .header-title p {
            margin: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 650;
        }

        .btn-share {
            border: 1px solid rgba(32,36,44,0.09);
            padding: 10px 17px;
            border-radius: 999px;
            background: rgba(255,255,255,0.82);
            color: var(--text-main);
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(31,35,42,0.05);
            backdrop-filter: blur(14px);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .btn-share:hover {
            transform: translateY(-1px);
            background: #fff;
            box-shadow: 0 10px 28px rgba(31,35,42,0.10);
        }

        .options-row {
            display: grid;
            grid-template-columns: 1fr 1.25fr auto auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            background: rgba(255,255,255,0.70);
            box-shadow: 0 10px 30px rgba(31,35,42,0.06);
            backdrop-filter: blur(20px);
        }

        .option-group {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .option-group label,
        .deck-label {
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .02em;
            color: #858a93;
        }

        select {
            width: 100%;
            min-width: 120px;
            height: 42px;
            padding: 0 34px 0 13px;
            border: 1px solid rgba(32,36,44,0.10);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.90);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }

        select:focus {
            border-color: rgba(37,99,235,0.55);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        .toggle-group {
            display: flex;
            gap: 5px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(31,35,42,0.055);
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            min-height: 34px;
            padding: 7px 13px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #737986;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
        }

        .time-btn:hover, .interior-btn:hover, .camera-btn:hover, .film-type-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.72);
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.18);
        }

        .time-btn[data-time="day"].active {
            background: #e3a315;
            color: #fff;
            box-shadow: 0 6px 16px rgba(227,163,21,0.22);
        }

        .interior-btn[data-color="black"].active {
            background: #20242c;
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.16);
        }

        .interior-btn[data-color="white"].active {
            background: white;
            color: #20242c;
            box-shadow: 0 5px 14px rgba(31,35,42,0.10);
        }

        .car-display {
            position: relative;
            width: 100%;
            height: min(67vh, 690px);
            min-height: 560px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #f1eee7 70%, #e9e6df 100%);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.75);
            transition: background-color 0.5s ease;
        }

        .car-display::after {
            content: "";
            position: absolute;
            inset: auto 7% 5% 7%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(31,35,42,.12), rgba(31,35,42,0) 70%);
            filter: blur(18px);
            pointer-events: none;
            z-index: 0;
        }

        #canvas-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .stage-control-deck {
            width: min(560px, calc(100% - 28px));
            margin: 12px 0 0 14px;
            height: 134px;
            min-height: 134px;
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 18px;
            align-items: center;
            padding: 13px 16px 13px 20px;
            border: 1px solid rgba(255,255,255,0.80);
            border-radius: 24px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 18px 38px rgba(31,35,42,0.13);
            backdrop-filter: blur(20px);
        }

        .deck-section {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .deck-divider {
            width: 1px;
            height: 42px;
            background: rgba(32,36,44,0.10);
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 38px);
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex: 0 0 auto;
        }

        .color-control-row {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .selected-color-name {
            margin: 0;
            flex: 0 0 auto;
            font-size: 13px;
            font-weight: 800;
            color: #555b65;
            white-space: nowrap;
        }

        /* PC에서 '차량 컬러' 글자만 조금 위로 */
        .stage-control-deck > .deck-section:first-child > .deck-label {
            position: relative;
            top: -8px;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.95);
            cursor: pointer;
            outline: 1px solid rgba(31,35,42,0.14);
            outline-offset: 2px;
            box-shadow: 0 4px 10px rgba(31,35,42,0.10);
            transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
        }

        .color-btn:hover { transform: translateY(-2px) scale(1.04); }

        .color-btn.active {
            transform: translateY(-2px) scale(1.08);
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
            box-shadow: 0 7px 17px rgba(31,35,42,0.16);
        }

        .right-panel {
            width: 390px;
            position: sticky;
            top: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(22px);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 19px;
            letter-spacing: -0.3px;
        }

        .product-select {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding: 17px;
            border: 1px solid rgba(37,99,235,0.28);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(238,245,255,.98), rgba(255,255,255,.96));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        }

        .product-select::after {
            content: "SELECTED";
            position: absolute;
            right: 14px;
            top: 13px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .11em;
            color: var(--accent-color);
            opacity: .75;
        }

        .product-select input[type="checkbox"] {
            width: 20px !important;
            height: 20px !important;
            accent-color: var(--accent-color) !important;
        }

        .film-type-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 17px;
            padding-bottom: 17px;
            border-bottom: 1px solid rgba(32,36,44,0.08);
        }

        .film-type-row .toggle-group { width: 100%; }
        .film-type-row .film-type-btn { flex: 1; }

        .tint-row {
            display: grid;
            grid-template-columns: 46px minmax(0,1fr);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tint-row:last-child { margin-bottom: 0; }

        .tint-label {
            width: auto;
            font-weight: 800;
            font-size: 13px;
            color: #3f4650;
        }

        .tint-options {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .tint-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            max-width: 42px;
            justify-self: center;
            border-radius: 50%;
            border: 1px solid transparent;
            background: #f0f1f3;
            color: #858b96;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
        }

        .tint-btn:hover {
            transform: translateY(-1px);
            background: #e5e7eb;
            color: #535964;
        }

        .tint-btn.active {
            transform: translateY(-1px);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 7px 15px rgba(37,99,235,.22);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-color);
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,.84);
            box-shadow: 0 8px 22px rgba(31,35,42,.08);
            backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 30;
        }

        @media (max-width: 1180px) {
            body { padding: 18px; }
            .container { grid-template-columns: 1fr; max-width: 1050px; }
            .right-panel { width: 100%; position: static; }
            .card { padding: 22px; }
            .car-display { height: 620px; }
            .tint-options { grid-template-columns: repeat(7, minmax(34px, 40px)); justify-content: start; }
        }

        @media (max-width: 760px) {
            body { padding: 12px; }
            .container { display: block; max-width: none; }
            .left-panel { display: block; min-width: 0; }
            .header-title { min-height: auto; margin: 0 0 10px; padding: 8px 3px 2px; }
            .header-title h1 { font-size: 22px; }
            .header-title p { width: 100%; font-size: 13px; }
            .btn-share { padding: 9px 13px; }
            .options-row { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; padding: 11px; }
            
            .car-display {
                width: 100%;
                height: 58vh;
                min-height: 430px;
                max-height: 780px;
                margin: 0;
                border-radius: 20px;
                box-shadow: 0 14px 36px rgba(31,35,42,0.16);
            }

            .car-display.mobile-car-fixed {
                position: fixed !important;
                top: 0 !important;
                left: 12px !important;
                right: 12px !important;
                width: auto !important;
                z-index: 5000 !important;
                margin: 0 !important;
                border-radius: 0 0 20px 20px;
                box-shadow: 0 16px 38px rgba(31,35,42,0.22);
            }

            .mobile-car-placeholder { display: none; width: 100%; }
            .mobile-car-placeholder.active { display: block; }

            .stage-control-deck {
                width: 100%; margin: 12px 0 14px; grid-template-columns: 1fr; gap: 12px; border-radius: 20px; padding: 14px;
                height: auto; min-height: 0;
            }

            /* 모바일에서 배경(낮/밤)을 차량 컬러보다 먼저 표시 */
            .stage-control-deck > .deck-section:last-child { order: 1; }
            .stage-control-deck > .deck-section:first-child { order: 2; }

            .deck-divider { display: none; }
            .stage-control-deck .toggle-group { justify-self: stretch; width: 100%; }
            .stage-control-deck .time-btn { flex: 1; }
            .color-palette { grid-template-columns: repeat(5, 34px); gap: 10px; width: auto; }
            .color-control-row { flex-direction: column; align-items: flex-start; gap: 9px; width: 100%; }
            .selected-color-name { font-size: 12px; padding-left: 2px; }
            .stage-control-deck > .deck-section:first-child > .deck-label { top: 0; }
            .color-btn { width: 34px; height: 34px; flex-basis: 34px; }
            
            .right-panel { width: 100%; margin-top: 0; position: static; }
            .card { border-radius: 22px; padding: 18px 14px 28px; }
            .film-type-row .toggle-group { width: 100%; }
            .tint-row { grid-template-columns: 42px minmax(0,1fr); gap: 6px; }
            .tint-options { gap: 4px; grid-template-columns: repeat(7, 1fr); }
            .tint-btn { max-width: 40px; font-size: 10px; }
        }

        .option-group .toggle-group:has(.interior-btn),
        .option-group .toggle-group:has(.camera-btn),
        .stage-control-deck .toggle-group,
        .film-type-row .toggle-group {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .interior-btn, .camera-btn, .time-btn, .film-type-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn.active, .camera-btn.active, .film-type-btn.active,
        .interior-btn[data-color="black"].active, .interior-btn[data-color="white"].active,
        .time-btn.active, .time-btn[data-time="day"].active, .time-btn[data-time="night"].active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn:hover, .camera-btn:hover, .time-btn:hover, .film-type-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .interior-btn.active:hover, .camera-btn.active:hover, .time-btn.active:hover, .film-type-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }

        .tint-btn {
            background: #f3f3f3 !important;
            color: #666666 !important;
            border: 1px solid #ececec !important;
            box-shadow: none !important;
        }

        .tint-btn:hover { background: #ebebeb !important; color: #222222 !important; box-shadow: none !important; }
        .tint-btn.active { background: #111111 !important; color: #ffffff !important; border: 1px solid #111111 !important; box-shadow: none !important; }

        .product-select { background: #ffffff !important; border: 1px solid #dddddd !important; box-shadow: none !important; }
        .product-select::after { color: #666666 !important; }
        .product-select input[type="checkbox"] {
    display: none !important;
}

        .left-panel > .car-display + .options-row { margin-top: 14px !important; margin-bottom: 14px !important; }
        @media (max-width: 760px) {
            .left-panel > .car-display + .options-row,
            .left-panel > .mobile-car-placeholder + .options-row { margin-top: 12px !important; margin-bottom: 14px !important; }
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-title">
            <div>
                <h1>디코닉 필름 농도 확인 3D V7</h1>
            </div>
            <button class="btn-share">공유하기</button>
        </div>

        <div class="car-display" id="car-display">
            <div id="loading">Loading Model & Environment...</div>
            <div id="canvas-container"></div>
        </div>

        <div class="options-row">
            <div class="option-group">
                <label>브랜드</label>
                <select>
                    <option>테슬라</option>
                </select>
            </div>

            <div class="option-group">
                <label>모델</label>
                <select id="model-select">
                    <option value="model_y">모델 Y 주니퍼</option>
                    <option value="model_3">모델 3 하이랜드</option>
                    <option value="cybertruck" disabled>사이버트럭(예정)</option>
                </select>
            </div>

            <div class="option-group">
                <label>실내색상</label>
                <div class="toggle-group">
                    <button class="interior-btn active" data-color="black">블랙</button>
                    <button class="interior-btn" data-color="white">화이트</button>
                </div>
            </div>

            <div class="option-group">
                <label>시점</label>
                <div class="toggle-group">
                    <button class="camera-btn active" data-view="exterior">외부</button>
                    <button class="camera-btn" data-view="interior">내부</button>
                </div>
            </div>
        </div>

        <div class="stage-control-deck">
            <div class="deck-section">
                <div class="deck-label">차량 컬러</div>
                <div class="color-control-row">
                    <div class="color-palette">
                        <div class="color-btn active" style="background-color: #313d5a;" data-color="스텔스 그레이" data-hex="#101318" title="스텔스 그레이"></div>
                        <div class="color-btn" style="background-color: #ffffff;" data-color="펄 화이트" data-hex="#e9f2fd" title="펄 화이트"></div>
                        <div class="color-btn" style="background-color: #000000;" data-color="다이아몬드 블랙" data-hex="#050505" title="다이아몬드 블랙"></div>
                        <div class="color-btn" style="background-color: #1b417f;" data-color="글레이셔 블루" data-hex="#0f1a2b" title="글레이셔 블루"></div>
                        <div class="color-btn" style="background-color: #931922;" data-color="울트라 레드" data-hex="#7d0009" title="울트라 레드"></div>
                        <div class="color-btn" style="background-color: #a5a9ac;" data-color="퀵실버" data-hex="#33373b" title="퀵실버"></div>
                    </div>
                    <p id="selected-color-name" class="selected-color-name">스텔스 그레이</p>
                </div>
            </div>

            <div class="deck-divider"></div>

            <div class="deck-section">
                <div class="deck-label">배경</div>
                <div class="toggle-group">
                    <button class="time-btn active" data-time="day">☀ 낮</button>
                    <button class="time-btn" data-time="night">☾ 밤</button>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <h2>썬팅(틴팅) 농도 선택</h2>

            <div class="product-select">
                <input type="checkbox" checked>
                <div>
                    <div style="font-weight: 800; font-size: 15px;">디코닉 럭스(비반사)</div>
                    <div style="font-weight: 850; font-size: 15px; margin-top: 2px;">디코닉 럭스R (반사)</div>
                </div>
            </div>

            <div class="film-type-row">
                <span style="font-weight: 800; font-size: 12px; color:#858a93;">필름 타입</span>
                <div class="toggle-group">
                    <button class="film-type-btn active" data-type="non-reflective">비반사 필름</button>
                    <button class="film-type-btn" data-type="reflective">반사 필름</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">전면</div>
                <div class="tint-options" data-part="front">

<script>
    window.addEventListener('error', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '스크립트 오류: ' + (e.message || '알 수 없는 오류');
        }
        console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '로드 오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
        console.error(e.reason);
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.sortObjects = true; // v2: transparent glass/film uses camera-depth sorting
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 2.0; 
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;           

    let dayExrTexture = null;
    let nightExrTexture = null;
    let hdriBackgroundSphere = null;
    const HDRI_ROTATION_Y = Math.PI * 0.35;

    function createOrUpdateHdriBackground(texture) {
        if (!texture) return;
        if (hdriBackgroundSphere) {
            scene.remove(hdriBackgroundSphere);
            if (hdriBackgroundSphere.geometry) hdriBackgroundSphere.geometry.dispose();
            if (hdriBackgroundSphere.material) {
                if (hdriBackgroundSphere.material.map) hdriBackgroundSphere.material.map.dispose();
                hdriBackgroundSphere.material.dispose();
            }
            hdriBackgroundSphere = null;
        }

        const bgTexture = texture.clone();
        bgTexture.mapping = THREE.UVMapping;
        bgTexture.needsUpdate = true;

        const bgGeometry = new THREE.SphereGeometry(50, 64, 32);
        const bgMaterial = new THREE.MeshBasicMaterial({
            map: bgTexture,
            side: THREE.BackSide
        });

        hdriBackgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
        hdriBackgroundSphere.rotation.y = HDRI_ROTATION_Y;
        hdriBackgroundSphere.frustumCulled = false;
        hdriBackgroundSphere.renderOrder = -1000;
        scene.add(hdriBackgroundSphere);
        scene.background = null;
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfffaeb, 1.0);
    dirLight.position.set(8, 6, 5); 
    scene.add(dirLight);
    const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);
    const interiorLight = new THREE.PointLight(0xffecc4, 0, 3);
    interiorLight.position.set(0, 1.0, 0);
    scene.add(interiorLight);

    let carBodyMaterials = []; 
    let interiorMaterial = null; 
    let interiorMaterials = []; 
    let seatMaterials = []; 
    let interiorTrimMaterials = []; 
    let glassMaterials = { front: [], row1: [], row2: [], rear: [], sunroof: [] };
    let glassMeshes = [];
    let outerGlassMeshes = [];
    let glassBorderMeshes = [];
    let roomMirrorMaterials = [];
    let roomMirrorMesh = null;
    let roomMirrorCubeCamera = null;
    let roomMirrorRenderTarget = null;
    let currentCarModel = null;

    let glassTintValues = { front: null, row1: null, row2: null, rear: null, sunroof: null };
    let currentFilmType = 'non-reflective';
    let currentViewMode = 'exterior';
    let neonGroup;

    const DEFAULT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/ulmer_muenster_2k.exr';
    const NIGHT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/hansaplatz_2k.exr';
    if (THREE.EXRLoader) {
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load(DEFAULT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            dayExrTexture = texture;
            scene.environment = dayExrTexture;
            createOrUpdateHdriBackground(dayExrTexture);
            updateAllGlassMaterials();
            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => mat.needsUpdate = true);
            }
        }, undefined, function(error) {
            console.warn('HDRI 로드 실패', error);
            scene.background = new THREE.Color(0xffffff);
        });

        exrLoader.load(NIGHT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            nightExrTexture = texture;

            const activeNightBtn = document.querySelector('.time-btn[data-time="night"].active');
            if (activeNightBtn) {
                scene.environment = nightExrTexture;
                createOrUpdateHdriBackground(nightExrTexture);
                updateAllGlassMaterials();
            }
        }, undefined, function(error) {
            console.warn('밤 HDRI 로드 실패', error);
        });
    } else {
        scene.background = new THREE.Color(0xffffff);
    }

    function setupNeonLights() {
        neonGroup = new THREE.Group();
        const xOffsets = [-2.5, 2.5];
        const zPositions = [-3.0, -1.0, 1.0, 3.0];
        xOffsets.forEach(x => {
            zPositions.forEach(z => {
                const light = new THREE.PointLight(0xffffff, 0.5, 4);
                light.position.set(x, 1.25, z);
                neonGroup.add(light);
            });
        });
        const ambientFill = new THREE.PointLight(0xffffff, 0.3, 10);
        ambientFill.position.set(0, 4, 0);
        neonGroup.add(ambientFill);
        scene.add(neonGroup);
        neonGroup.visible = false;
    }
    setupNeonLights();

    const INTERIOR_TRIM_COLOR = 0x050505; 
    const WHITE_SEAT_COLOR = 0x464644;    

    function applyInteriorMatte(mat) {
        if (!mat) return;
        mat.metalness = 0.0;
        mat.roughness = 1.0;
        mat.envMapIntensity = 0.0;
        if ('clearcoat' in mat) mat.clearcoat = 0.0;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
        mat.needsUpdate = true;
    }

    // ★ 누락되었던 실내 색상 반영 함수들 복구!
    function setInteriorTrimBase() {
        interiorTrimMaterials.forEach(mat => {
            mat.color.setHex(INTERIOR_TRIM_COLOR);
            applyInteriorMatte(mat);
        });
    }

    function updateSeatColor(colorHex) {
        setInteriorTrimBase();
        if (seatMaterials.length > 0) {
            seatMaterials.forEach(mat => {
                mat.color.setHex(colorHex);
                applyInteriorMatte(mat);
            });
        } else if (interiorMaterial) {
            interiorMaterial.color.setHex(colorHex);
            applyInteriorMatte(interiorMaterial);
        }
    }

    // 바깥유리 셋팅
    function applyOuterGlassMaterial(mat) {
        if (!mat) return;
        const userData = mat.userData || {};
        const outerPart = userData.outerGlassPart || 'front';

        // v4: outer는 "색을 만드는 층"이 아니라 거의 무색의 실제 유리 표면만 담당한다.
        // 썬팅의 색/농도는 film 레이어에서만 표현한다.
        mat.side = THREE.DoubleSide;
        mat.transparent = true;
        mat.depthTest = true;
        mat.depthWrite = false;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.alphaTest = 0.0;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.polygonOffset = false;

        // 회녹색을 제거하고 거의 무색 유리로 변경
        mat.color.setHex(0xffffff);

        if (currentViewMode === 'interior') {
            mat.opacity = 0.004;
            mat.metalness = 0.0;
            mat.roughness = 0.26;
            mat.envMapIntensity = 0.018;
            if ('clearcoat' in mat) mat.clearcoat = 0.015;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.42;
        } else {
            // 바깥에서는 하이라이트/반사만 아주 약하게 남긴다.
            const sideGlass = ['row1', 'row2', 'quarter', 'rear'].includes(outerPart);

if (sideGlass) {
    mat.opacity = 0.010;
    mat.roughness = 0.13;
    mat.envMapIntensity = 0.11;
    if ('clearcoat' in mat) mat.clearcoat = 0.08;
    if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.18;
} else {
    // 전면 바깥유리
    mat.opacity = 0.07;
    mat.roughness = 0.08;
    mat.envMapIntensity = 0.25;
    if ('clearcoat' in mat) mat.clearcoat = 0.18;
    if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.10;
        }
        }

        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.001;

        mat.userData = Object.assign({}, mat.userData, { baseOpacity: mat.opacity, glassLayer: 'outer' });
        mat.needsUpdate = true;
    }

    // 테두리 셋팅
    function applyGlassBorderMaterial(mat) {
        if (!mat) return;
        const isInteriorView = currentViewMode === 'interior';

        // v4 핵심: glass_border는 투명 레이어가 아니다.
        // 먼저 깊이 버퍼에 기록해서 그 뒤의 film/outer가 테두리 위로 덮이지 않게 한다.
        mat.side = THREE.DoubleSide;
        mat.color.setHex(isInteriorView ? 0x070707 : 0x050505);
        mat.transparent = false;
        mat.opacity = 1.0;
        mat.alphaTest = 0.0;
        mat.depthTest = true;
        mat.depthWrite = true;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;

        mat.metalness = 0.0;
        mat.roughness = isInteriorView ? 0.68 : 0.48;
        mat.envMapIntensity = isInteriorView ? 0.015 : 0.025;
        mat.reflectivity = 0.0;

        if ('clearcoat' in mat) mat.clearcoat = isInteriorView ? 0.01 : 0.05;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.68;
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.0;
        if ('thickness' in mat) mat.thickness = 0.0;

        mat.polygonOffset = false;
        mat.needsUpdate = true;
    }

    // 썬팅 필름 셋팅
    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        // v2: 한 개의 물리적으로 분리된 필름면을 양면 렌더링한다.
        // 같은 geometry를 FrontSide/BackSide로 복제하지 않아 농도 중첩을 방지한다.
        mat.side = THREE.DoubleSide;
        mat.transparent = true;
        mat.depthWrite = false;
        mat.depthTest = true;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.alphaTest = 0.0;
        mat.polygonOffset = false;

        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.001;

        // '없음' 선택:
        // 전면/1열/2열/후면은 썬팅 필름 효과를 제거한다.
        // 썬루프 '없음'은 썬루프 전용 5% 가중치를 쓰지 않고,
        // 일반 측면 5%와 같은 농도 계산을 사용한다.
        const isSunroofNone = (partName === 'sunroof' && tintValue == null);

        if (tintValue == null) {
            if (isSunroofNone) {
                tintValue = 5;
            } else {
                mat.color.setHex(0xffffff);
                mat.opacity = 0.08;
                mat.metalness = 0.0;
                mat.roughness = 0.0;
                mat.envMapIntensity = 0.0;
                if ('clearcoat' in mat) mat.clearcoat = 0.0;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
                mat.userData = Object.assign({}, mat.userData, { baseOpacity: 0.08, glassLayer: 'film' });
                mat.needsUpdate = true;
                return;
            }
        }

        // 화면용 농도. 가까운 창 + 실내 + 반대편 창의 깊이감이 남도록 설정.
        let opacityValue;
        if (tintValue >= 70) opacityValue = 0.28;
        else if (tintValue >= 50) opacityValue = 0.48;
        else if (tintValue >= 30) opacityValue = 0.63;
        else if (tintValue >= 22) opacityValue = 0.72;
        else if (tintValue >= 15) opacityValue = 0.77;
        else opacityValue = 0.90;

        if (partName === 'sunroof' && !isSunroofNone) {
            if (tintValue >= 70) opacityValue = 0.42;
            else if (tintValue >= 50) opacityValue = 0.50;
            else if (tintValue >= 30) opacityValue = 0.59;
            else if (tintValue >= 22) opacityValue = 0.66;
            else if (tintValue >= 15) opacityValue = 0.72;
            else opacityValue = 0.82;
        }

        if (currentViewMode === 'interior') {
            if (partName === 'sunroof' && !isSunroofNone) {
                if (tintValue >= 70) {
                    opacityValue = 0.23;
                } else if (tintValue >= 50) {
                    opacityValue = 0.35;
                } else {
                    opacityValue = Math.max(0.42, opacityValue - 0.16);
                }
            } else {
                if (tintValue >= 70) opacityValue = 0.020;
                else if (tintValue >= 50) opacityValue = 0.036;
                else if (tintValue >= 30) opacityValue = 0.090;
                else if (tintValue >= 22) opacityValue = 0.100;
                else if (tintValue >= 15) opacityValue = 0.135;
                else opacityValue = 0.20;
            }
        }

        if (partName === 'sunroof' && currentViewMode === 'exterior') {
            // 외부 썬루프는 필름 타입/농도/없음 선택과 무관하게
            // 항상 현재 비반사 상태와 동일한 고정 재질로 표시한다.
            // 내부 시점 로직은 아래 interior 분기에서 그대로 유지된다.
            mat.color.setHex(0x030404);
            mat.opacity = 0.828;
            mat.metalness = 0.0;
            mat.roughness = 0.12;
            mat.envMapIntensity = 0.08;
            if ('clearcoat' in mat) mat.clearcoat = 0.08;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
        } else if (currentViewMode === 'interior') {
            mat.color.setHex(0x080a0a);
            mat.opacity = opacityValue;
            mat.metalness = 0.0;
            mat.roughness = 0.36;
            mat.envMapIntensity = 0.015;
            if ('clearcoat' in mat) mat.clearcoat = 0.0;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.55;
        } else if (filmType === 'reflective') {
            // 반사 필름은 검은 판처럼 막지 않고 표면 반사로 성격을 표현한다.
            mat.color.setHex(0x070808);
            mat.opacity = Math.min(opacityValue * 0.95, 0.88);
            mat.metalness = 0.02;
            mat.roughness = 0.035;
            mat.envMapIntensity = 0.24;
            if ('clearcoat' in mat) mat.clearcoat = 0.25;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.025;
        } else {
            mat.color.setHex(0x030404);
            // 기존 opacityValue를 그대로 쓰되 조금 약하게
            mat.opacity = opacityValue * 0.90;
            mat.metalness = 0.0;
            mat.roughness = 0.12;
            mat.envMapIntensity = 0.08;
            if ('clearcoat' in mat) mat.clearcoat = 0.08;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
        }

        // v3: 동적 투명 정렬에서 가까운 창은 이 값 그대로, 반대편 창만 극히 약하게 표시
        mat.userData = Object.assign({}, mat.userData, { baseOpacity: mat.opacity, glassLayer: 'film' });
        mat.needsUpdate = true;
    }

    function updateExteriorGlassLayering() {
        if (!camera || !glassMeshes.length) return;

        // 현재 모델의 좌/우 축은 X. 카메라가 있는 쪽을 가까운 창으로 판단한다.
        const cameraX = camera.position.x;
        // 정면에서도 0으로 만들지 않고 좌/우 중 하나로 계속 판정
        const cameraSide = cameraX >= 0 ? 1 : -1;

        glassMeshes.forEach(mesh => {
            if (!mesh || !mesh.material) return;

            const mat = mesh.material;
            const side = mesh.userData.windowSide || mat.userData.windowSide || 0;
            const layer = mesh.userData.glassLayer || mat.userData.glassLayer || '';
            const baseOpacity = mat.userData.baseOpacity;
            if (typeof baseOpacity !== 'number') return;

            // 전면/후면/루프 또는 실내시점은 일반 깊이 정렬을 사용한다.
           if (currentViewMode === 'interior' || side === 0) {
           mat.opacity = baseOpacity;
           mesh.renderOrder = 0;
           return;
            }

            const isNearSide = side === cameraSide;
            if (isNearSide) {
                // 가까운 쪽: 필름을 먼저, 실제 바깥 유리 표면을 마지막에 그린다.
                mat.opacity = baseOpacity;
                mesh.renderOrder = layer === 'outer' ? 31 : 30;
            } else {
                // 반대편 쪽: 실제 차에서 희미하게 보이는 수준만 남긴다.
                // 카메라 각도에 따라 먼 유리가 갑자기 앞에 덮여 검게 되는 현상을 막는다.
                if (layer === 'film') {
                    mat.opacity = Math.min(baseOpacity * 0.08, 0.032);
                    mesh.renderOrder = 11;
                } else if (layer === 'outer') {
                    mat.opacity = Math.min(baseOpacity * 0.10, 0.006);
                    mesh.renderOrder = 10;
                }
            }
        });
    }

    function updateAllGlassMaterials() {
        outerGlassMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyOuterGlassMaterial(mesh.material);
                mesh.visible = true;
            }
        });

        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });

        glassBorderMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyGlassBorderMaterial(mesh.material);
                mesh.visible = true;
            }
        });

        updateExteriorGlassLayering();
    }

    function setInteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    function restoreExteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    // 후면 썬팅 농도에 따라 실내 룸미러 반사 밝기만 조절
    function updateRoomMirrorTint() {
        const rearTint = glassTintValues.rear;

        let brightness = 1.0;

        if (rearTint == null) brightness = 1.0;       // 없음
        else if (rearTint >= 70) brightness = 0.98;
        else if (rearTint >= 50) brightness = 0.94;
        else if (rearTint >= 30) brightness = 0.90;
        else if (rearTint >= 22) brightness = 0.86;
        else if (rearTint >= 15) brightness = 0.82;
        else brightness = 0.75;                      // 5%

        roomMirrorMaterials.forEach(mat => {
            if (!mat) return;
            mat.color.setRGB(brightness, brightness, brightness);
            mat.envMapIntensity = 0.25 * brightness;
            mat.needsUpdate = true;
        });
    }

    // 룸미러에 HDRI만 비추는 대신 실제 차량 실내/후방 장면을 실시간 반사
    function setupRoomMirrorReflection() {
        if (!roomMirrorMesh || roomMirrorCubeCamera) return;

        roomMirrorRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
            generateMipmaps: true,
            minFilter: THREE.LinearMipmapLinearFilter
        });

        roomMirrorCubeCamera = new THREE.CubeCamera(
            0.05,
            100,
            roomMirrorRenderTarget
        );

        const mirrorPos = new THREE.Vector3();
        roomMirrorMesh.getWorldPosition(mirrorPos);
        roomMirrorCubeCamera.position.copy(mirrorPos);
        scene.add(roomMirrorCubeCamera);

        roomMirrorMaterials.forEach(mat => {
            if (!mat) return;
            mat.envMap = roomMirrorRenderTarget.texture;
            mat.needsUpdate = true;
        });
    }

    function showLoadingMessage(message) {

    function handleModelLoaded(gltf) {
        try {
            if (currentCarModel) {
                scene.remove(currentCarModel);
                currentCarModel = null;
            }

            if (roomMirrorCubeCamera) {
                scene.remove(roomMirrorCubeCamera);
                roomMirrorCubeCamera = null;
            }
            if (roomMirrorRenderTarget) {
                roomMirrorRenderTarget.dispose();
                roomMirrorRenderTarget = null;
            }
            roomMirrorMesh = null;
            roomMirrorMaterials = [];

            carBodyMaterials = [];
            interiorMaterial = null;
            interiorMaterials = [];
            seatMaterials = [];
            interiorTrimMaterials = [];
            glassMaterials = { front: [], row1: [], row2: [], rear: [], sunroof: [] };
            glassMeshes = [];
            outerGlassMeshes = [];
            glassBorderMeshes = [];

            const model = gltf.scene;
            const meshesToAdd = [];
            const meshesToHide = [];

            // v2 helper: side outer glass가 좌/우를 한 mesh에 담고 있으면
            // 투명 정렬이 object 중심 하나로 계산되어 반대편 유리가 앞에 덮이는 현상이 생길 수 있다.
            // 삼각형의 world X 중심을 기준으로 좌/우 두 mesh로 런타임 분리한다.
            function splitSideOuterByWorldX(sourceMesh, material) {
                if (!sourceMesh || !sourceMesh.geometry || !sourceMesh.parent) return null;

                sourceMesh.updateMatrixWorld(true);
                const srcGeo = sourceMesh.geometry.index ? sourceMesh.geometry.toNonIndexed() : sourceMesh.geometry.clone();
                const pos = srcGeo.getAttribute('position');
                if (!pos || pos.count < 6) return null;

                const attrNames = Object.keys(srcGeo.attributes);
                const buckets = {
                    left: Object.fromEntries(attrNames.map(n => [n, []])),
                    right: Object.fromEntries(attrNames.map(n => [n, []]))
                };
                let leftTriangles = 0;
                let rightTriangles = 0;
                const c = new THREE.Vector3();

                function pushVertex(bucket, vertexIndex) {
                    attrNames.forEach(name => {
                        const attr = srcGeo.getAttribute(name);
                        const arr = buckets[bucket][name];
                        for (let k = 0; k < attr.itemSize; k++) {
                            arr.push(attr.array[vertexIndex * attr.itemSize + k]);
                        }
                    });
                }

                for (let i = 0; i + 2 < pos.count; i += 3) {
                    c.set(
                        (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3,
                        (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3,
                        (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3
                    ).applyMatrix4(sourceMesh.matrixWorld);
                    const bucket = c.x >= 0 ? 'right' : 'left';
                    pushVertex(bucket, i);
                    pushVertex(bucket, i + 1);
                    pushVertex(bucket, i + 2);
                    if (bucket === 'right') rightTriangles++; else leftTriangles++;
                }

                if (!leftTriangles || !rightTriangles) {
                    srcGeo.dispose();
                    return null;
                }

                function makeHalf(bucket, suffix) {
                    const geo = new THREE.BufferGeometry();
                    attrNames.forEach(name => {
                        const srcAttr = srcGeo.getAttribute(name);
                        const TypedArray = srcAttr.array.constructor;
                        const data = new TypedArray(buckets[bucket][name]);
                        geo.setAttribute(name, new THREE.BufferAttribute(data, srcAttr.itemSize, srcAttr.normalized));
                    });
                    geo.computeBoundingBox();
                    geo.computeBoundingSphere();

                    const half = sourceMesh.clone(false);
                    half.name = sourceMesh.name + suffix;
                    half.geometry = geo;
                    half.material = material.clone();
                    const sideSign = bucket === 'right' ? 1 : -1;
                    half.material.userData = Object.assign({}, material.userData, { windowSide: sideSign, glassLayer: 'outer' });
                    half.userData = Object.assign({}, half.userData, { windowSide: sideSign, glassLayer: 'outer' });
                    half.material.side = THREE.DoubleSide;
                    half.renderOrder = 0;
                    return half;
                }

                const leftMesh = makeHalf('left', '_L_runtime');
                const rightMesh = makeHalf('right', '_R_runtime');
                srcGeo.dispose();
                return [leftMesh, rightMesh];
            }

            model.updateMatrixWorld(true);

            model.traverse((child) => {
                if (!(child.isMesh && child.material)) return;

                const rawMatName = child.material.name || '';
                const matName = rawMatName.toLowerCase();
                const meshName = (child.name || '').toLowerCase();

// 사이드미러 거울 재질
if (matName === 'mirror') {
    const mirrorMat = child.material.clone();

    mirrorMat.color.setHex(0xffffff);
    mirrorMat.metalness = 1.0;
    mirrorMat.roughness = 0.02;
    mirrorMat.envMapIntensity = 1.5;

    if ('clearcoat' in mirrorMat) {
        mirrorMat.clearcoat = 1.0;
    }

    if ('clearcoatRoughness' in mirrorMat) {
        mirrorMat.clearcoatRoughness = 0.0;
    }

    mirrorMat.needsUpdate = true;
    child.material = mirrorMat;

    // GLB에서 실내 룸미러 재질명은 'MIRROR', 사이드미러는 'mirror'
    if (rawMatName === 'MIRROR') {
        roomMirrorMaterials.push(mirrorMat);
        roomMirrorMesh = child;
    }
}

                if (matName.includes('body')) {
                    if (!meshName.includes('plate') && !meshName.includes('license')) {
                        const bodyMat = child.material.clone();
                        bodyMat.metalness = 0.25;
                        bodyMat.roughness = 0.45;
                        bodyMat.clearcoat = 0.35;
                        bodyMat.clearcoatRoughness = 0.25;
                        child.material = bodyMat;
                        carBodyMaterials.push(bodyMat);
                    }
                }

                const interiorKey = matName + ' ' + meshName;
                const isSeatPart = interiorKey.includes('seat');
                const isInteriorTrimPart =
                    interiorKey.includes('interior') || interiorKey.includes('cabin') ||
                    interiorKey.includes('door') || interiorKey.includes('dashboard') ||
                    interiorKey.includes('dash') || interiorKey.includes('panel') ||
                    interiorKey.includes('trim') || interiorKey.includes('leather');
                   

                const isExcludedInteriorPart =
                    interiorKey.includes('glass') || interiorKey.includes('window') ||
                    interiorKey.includes('windshield') || interiorKey.includes('body') ||
                    interiorKey.includes('paint') || interiorKey.includes('wheel') ||
                    interiorKey.includes('tire') || interiorKey.includes('rim') ||
                    interiorKey.includes('chrome') || interiorKey.includes('metal');

                if ((isSeatPart || isInteriorTrimPart) && !isExcludedInteriorPart) {
                    const interiorMat = child.material.clone();
                    interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                    if (isSeatPart) {
                        seatMaterials.push(interiorMat);
                        interiorMaterial = interiorMat;
                    } else {
                        interiorTrimMaterials.push(interiorMat);
                    }
                    applyInteriorMatte(interiorMat);
                    child.material = interiorMat;
                    interiorMaterials.push(interiorMat);
                }

                const geoName = child.geometry && child.geometry.name ? child.geometry.name.toLowerCase() : '';
                const glassKey = matName + ' ' + meshName + ' ' + geoName;

                // v2는 현재 GLB의 명시적인 object/material 이름만 사용한다.
                // Object_2.xxx 번호 fallback은 새 export에서 번호가 바뀌면 오분류를 만들 수 있어 제거.
                const isGlassBorder = glassKey.includes('glass_border');
                const isSunroofGlass = glassKey.includes('glass_roof_panorama');
                const isGlassFilm = glassKey.includes('_film') && !glassKey.includes('_outer');
                const isOuterGlass = glassKey.includes('_outer');

               if (isGlassBorder) {
               const borderMat = new THREE.MeshBasicMaterial({
               color: 0x050505,
               side: THREE.DoubleSide,
               transparent: false,
               opacity: 1.0,
               depthTest: true,
               depthWrite: true
               });

               borderMat.userData = { isGlassBorder: true };

               child.material = borderMat;
               child.renderOrder = -20;
               glassBorderMeshes.push(child);
                }
                else if (isSunroofGlass) {
                    const roofMat = child.material.clone();
                    roofMat.side = THREE.DoubleSide;
                    roofMat.userData = Object.assign({}, roofMat.userData, { isSunroofGlass: true, glassPart: 'sunroof' });
                    child.material = roofMat;
                    child.renderOrder = 0;
                    glassMeshes.push(child);
                    glassMaterials.sunroof.push(roofMat);
                }
                else if (isGlassFilm) {
                    let filmPart = 'front';
                    if (glassKey.includes('glass_front1_film')) filmPart = 'row1';
                    else if (glassKey.includes('glass_front2_film')) filmPart = 'row2';
                    else if (glassKey.includes('glass_front3_film') || glassKey.includes('glass_quarter_film')) filmPart = 'row2';
                    else if (glassKey.includes('glass_rear_film')) filmPart = 'rear';

                    const filmWorldPos = new THREE.Vector3();
                    if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
                    child.geometry.boundingBox.getCenter(filmWorldPos).applyMatrix4(child.matrixWorld);
                    const filmSide = Math.abs(filmWorldPos.x) > 0.15 ? (filmWorldPos.x > 0 ? 1 : -1) : 0;

                    const filmMat = child.material.clone();
                    filmMat.side = THREE.DoubleSide;
                    filmMat.userData = Object.assign({}, filmMat.userData, {
                        isTintFilmLayer: true,
                        glassPart: filmPart,
                        windowSide: filmSide,
                        glassLayer: 'film'
                    });
                    child.userData = Object.assign({}, child.userData, { windowSide: filmSide, glassLayer: 'film' });
                    child.material = filmMat;
                    child.renderOrder = 0;
                    glassMeshes.push(child);
                    glassMaterials[filmPart].push(filmMat);
                }
                else if (isOuterGlass) {
                    let outerPart = 'front';
                    if (glassKey.includes('glass_front1_outer')) outerPart = 'row1';
                    else if (glassKey.includes('glass_front2_outer')) outerPart = 'row2';
                    else if (glassKey.includes('glass_front3_outer') || glassKey.includes('glass_quarter_outer')) outerPart = 'quarter';
                    else if (glassKey.includes('glass_rear_outer')) outerPart = 'rear';

                    const outerMat = child.material.clone();
                    outerMat.side = THREE.DoubleSide;
                    outerMat.userData = Object.assign({}, outerMat.userData, { outerGlassPart: outerPart });

                    // 측면 outer는 GLB에서 좌/우가 한 mesh이므로 런타임에 두 object로 분리해
                    // 카메라 거리 기준 transparent sorting이 각 창마다 따로 되게 한다.
                    if (['row1', 'row2', 'quarter'].includes(outerPart)) {
                        const halves = splitSideOuterByWorldX(child, outerMat);
                        if (halves && halves.length === 2) {
                            meshesToHide.push(child);
                            halves.forEach(half => {
                                meshesToAdd.push({ parent: child.parent, mesh: half });
                                glassMeshes.push(half);
                                outerGlassMeshes.push(half);
                            });
                        } else {
                            child.material = outerMat;
                            child.userData = Object.assign({}, child.userData, { windowSide: 0, glassLayer: 'outer' });
                            child.renderOrder = 0;
                            glassMeshes.push(child);
                            outerGlassMeshes.push(child);
                        }
                    } else {
                        child.material = outerMat;
                        child.userData = Object.assign({}, child.userData, { windowSide: 0, glassLayer: 'outer' });
                        child.renderOrder = 0;
                        glassMeshes.push(child);
                        outerGlassMeshes.push(child);
                    }
                }
                // headlights 등 다른 'glass' 재질은 건드리지 않는다.
            });

            meshesToHide.forEach(mesh => mesh.visible = false);
            meshesToAdd.forEach(item => {
                if (item.parent && item.mesh) item.parent.add(item.mesh);
            });

            scene.add(model);
            currentCarModel = model;
            model.updateMatrixWorld(true);

            const originPoint = new THREE.Vector3(0, 0.6, 0);
            controls.target.copy(originPoint);
            controls.update();

            extTargetPos.copy(originPoint);
            extCameraPos.set(originPoint.x + 4, originPoint.y + 1.6, originPoint.z + 4);
            camera.position.copy(extCameraPos);

            if (carBodyMaterials.length > 0) {
                const activeColorBtn = document.querySelector('.color-btn.active');
                const selectedHex = activeColorBtn ? activeColorBtn.getAttribute('data-hex') : '#0f141e';
                carBodyMaterials.forEach(mat => mat.color.set(selectedHex));
            }

            const activeInteriorBtn = document.querySelector('.interior-btn.active');
            updateSeatColor(activeInteriorBtn && activeInteriorBtn.getAttribute('data-color') === 'white'
                ? WHITE_SEAT_COLOR
                : INTERIOR_TRIM_COLOR);
            updateAllGlassMaterials();
            updateRoomMirrorTint();
            setupRoomMirrorReflection();

            loadingEl.style.display = 'none';
        } catch (err) {
            console.error('모델 처리 중 오류가 발생했습니다.', err);
            showLoadingMessage('모델 처리 오류: ' + (err.message || err));
        }
    }

    const MODEL_FILES = {

    (function setupMobileCarSticky() {
        const carDisplayMobile = document.getElementById('car-display');
        if (!carDisplayMobile) return;

        const mobileQuery = window.matchMedia('(max-width: 760px)');
        const placeholder = document.createElement('div');
        placeholder.className = 'mobile-car-placeholder';
        carDisplayMobile.insertAdjacentElement('afterend', placeholder);

        let stickyStartY = 0;
        let rafPending = false;

        function getStickyStart() {
            const anchor = carDisplayMobile.classList.contains('mobile-car-fixed')
                ? placeholder
                : carDisplayMobile;
            return anchor.getBoundingClientRect().top + window.scrollY;
        }

        function releaseSticky() {
            carDisplayMobile.classList.remove('mobile-car-fixed');
            placeholder.classList.remove('active');
            placeholder.style.height = '0px';
        }

        function measure() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const wasFixed = carDisplayMobile.classList.contains('mobile-car-fixed');
            if (wasFixed) {
                carDisplayMobile.classList.remove('mobile-car-fixed');
                placeholder.classList.remove('active');
                placeholder.style.height = '0px';
            }

            stickyStartY = carDisplayMobile.getBoundingClientRect().top + window.scrollY;
            updateSticky();
        }

        function updateSticky() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const shouldFix = window.scrollY >= stickyStartY;

            if (shouldFix) {
                if (!carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    const currentHeight = carDisplayMobile.getBoundingClientRect().height;
                    placeholder.style.height = currentHeight + 'px';
                    placeholder.classList.add('active');
                    carDisplayMobile.classList.add('mobile-car-fixed');
                }
            } else {
                if (carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    releaseSticky();
                }
            }
        }

        function onScroll() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                updateSticky();
                rafPending = false;
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            clearTimeout(window.__mobileCarStickyResizeTimer);
            window.__mobileCarStickyResizeTimer = setTimeout(measure, 120);
        });

        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', measure);
        } else if (mobileQuery.addListener) {
            mobileQuery.addListener(measure);
        }

        window.addEventListener('load', () => {
            setTimeout(measure, 150);
        });

        setTimeout(measure, 0);
    })();

</script>
</body>
</html>
