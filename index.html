    mirrorMat.needsUpdate = true;
    child.material = mirrorMat;

    // GLB에서 실내 룸미러 재질명은 'MIRROR', 사이드미러는 'mirror'
    if (rawMatName === 'MIRROR') {
        // Model 3는 미러 면 방향이 Model Y보다 약간 앞쪽을 향해 있어
        // 내부 시점에서 후방 반사가 아니라 천장/전방 쪽이 비쳐 보일 수 있다.
        // 반사면만 뒤쪽(탑승자 쪽)으로 180도 돌려 Model Y와 같은 후방 반사 느낌으로 맞춘다.
        if (currentCarModelKey === 'model_3') {
            child.rotateY(Math.PI);
            child.updateMatrixWorld(true);
        }

        roomMirrorMaterials.push(mirrorMat);
        roomMirrorMesh = child;
    }
}

                if (matName.includes('body')) {
                    if (!meshName.includes('plate') && !meshName.includes('license')) {
                        const bodyMat = child.material.clone();
                        bodyMat.metalness = 0.25;
                        bodyMat.roughness = 0.45;
                        bodyMat.clearcoat = 0.35;
                        bodyMat.clearcoatRoughness = 0.25;

                        // Model 3 모바일 본넷 깜박임 방지:
                        // body_main 바로 아래에 매우 가까운 보조 면들이 있어 일부 모바일 GPU의
                        // 낮은 depth 정밀도에서 순간적으로 앞/뒤가 뒤집혀 보일 수 있다.
                        // 색상/광택은 그대로 두고 본넷/차체 본체의 depth 우선순위만 아주 조금 앞으로 당긴다.
                        if (matName === 'body_main') {
                            bodyMat.polygonOffset = true;
                            bodyMat.polygonOffsetFactor = -2.0;
                            bodyMat.polygonOffsetUnits = -2.0;
                        }

                        child.material = bodyMat;
                        carBodyMaterials.push(bodyMat);
                    }
                }

                // Model 3 룸미러는 이제 Blender에서 Rearviewmirror 오브젝트로 분리되어 있으므로
                // 위치 기반 임시 overlay 생성은 사용하지 않는다.

                // 실제 Model 3 도어 손잡이는 Geodoorl2sub11Mtl에 포함되어 있다.
                // 손잡이 면만 별도 overlay로 만들어 원거리에서도 끊기지 않게 표시한다.
                if (currentCarModelKey === 'model_3' && matName === 'geodoorl2sub11mtl') {
                    createModel3DoorHandleOverlays(child);
                }

                const interiorKey = matName + ' ' + meshName;
                // Model 3 GLB는 시트와 전면 방향지시등 일부가 같은 Ln7Mtl 재질을 공유한다.
                // 먼저 둘을 분리하고, 시트만 실내색상 변경 대상에 넣는다.
                const isModel3SeatPart = matName === 'ln7mtl';

                if (isModel3SeatPart) {
                    const split = splitModel3SeatAndIndicator(child);
                    if (split) {
                        meshesToHide.push(child);
                        meshesToAdd.push({ parent: child.parent, mesh: split.seatMesh });
                        meshesToAdd.push({ parent: child.parent, mesh: split.indicatorMesh });

                        split.seatMat.userData = Object.assign({}, split.seatMat.userData, {
                            isModel3Seat: true,
                            originalSeatColorHex: split.seatMat.color.getHex(),
                            originalSeatMetalness: split.seatMat.metalness,
                            originalSeatRoughness: split.seatMat.roughness,
                            originalSeatEnvMapIntensity: split.seatMat.envMapIntensity,
                            originalSeatClearcoat: ('clearcoat' in split.seatMat) ? split.seatMat.clearcoat : undefined,
                            originalSeatClearcoatRoughness: ('clearcoatRoughness' in split.seatMat) ? split.seatMat.clearcoatRoughness : undefined
                        });

                        seatMaterials.push(split.seatMat);
                        interiorMaterial = split.seatMat;
                        interiorMaterials.push(split.seatMat);
                        return;
                    }
                }

                const isSeatPart = interiorKey.includes('seat');
                const isInteriorTrimPart =
                    interiorKey.includes('interior') || interiorKey.includes('cabin') ||
                    interiorKey.includes('door') || interiorKey.includes('dashboard') ||
                    interiorKey.includes('dash') || interiorKey.includes('panel') ||
                    interiorKey.includes('trim') || interiorKey.includes('leather');
                   

                const isExcludedInteriorPart =
                    interiorKey.includes('glass') || interiorKey.includes('window') ||
                    interiorKey.includes('windshield') || interiorKey.includes('body') ||
                    interiorKey.includes('paint') || interiorKey.includes('wheel') ||
                    interiorKey.includes('tire') || interiorKey.includes('rim') ||
                    interiorKey.includes('chrome') || interiorKey.includes('metal');

                if ((isSeatPart || isInteriorTrimPart) && !isExcludedInteriorPart) {
                    const interiorMat = child.material.clone();

                    if (isModel3SeatPart) {
                        // Model 3 화이트 시트의 원래 재질값을 보관한다.
                        interiorMat.userData = Object.assign({}, interiorMat.userData, {
                            isModel3Seat: true,
                            originalSeatColorHex: interiorMat.color.getHex(),
                            originalSeatMetalness: interiorMat.metalness,
                            originalSeatRoughness: interiorMat.roughness,
                            originalSeatEnvMapIntensity: interiorMat.envMapIntensity,
                            originalSeatClearcoat: ('clearcoat' in interiorMat) ? interiorMat.clearcoat : undefined,
                            originalSeatClearcoatRoughness: ('clearcoatRoughness' in interiorMat) ? interiorMat.clearcoatRoughness : undefined
                        });
                    } else {
                        interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                        applyInteriorMatte(interiorMat);
                    }

                    if (isSeatPart) {
                        seatMaterials.push(interiorMat);
                        interiorMaterial = interiorMat;
                    } else {
                        interiorTrimMaterials.push(interiorMat);
                    }

                    child.material = interiorMat;
                    interiorMaterials.push(interiorMat);
                }

                const geoName = child.geometry && child.geometry.name ? child.geometry.name.toLowerCase() : '';
                const glassKey = matName + ' ' + meshName + ' ' + geoName;

                // v2는 현재 GLB의 명시적인 object/material 이름만 사용한다.
                // Object_2.xxx 번호 fallback은 새 export에서 번호가 바뀌면 오분류를 만들 수 있어 제거.
                const isGlassBorder = glassKey.includes('glass_border');
                const isSunroofGlass = glassKey.includes('glass_roof_panorama');
                const isRearOuterTint = glassKey.includes('glass_rear_outertint') || glassKey.includes('glass_rear_outer.tint');
                const isGlassFilm = glassKey.includes('_film') && !glassKey.includes('_outer');
                const isOuterGlass = glassKey.includes('_outer') && !isRearOuterTint;

               if (isGlassBorder) {
               const borderMat = new THREE.MeshBasicMaterial({
               color: 0x050505,
               side: THREE.DoubleSide,
               transparent: false,
               opacity: 1.0,
               depthTest: true,
               depthWrite: true
               });

               borderMat.userData = { isGlassBorder: true };

               child.material = borderMat;
               child.renderOrder = -20;
               glassBorderMeshes.push(child);
                }
                else if (isSunroofGlass) {
                    const roofMat = child.material.clone();
                    roofMat.side = THREE.DoubleSide;
                    roofMat.userData = Object.assign({}, roofMat.userData, { isSunroofGlass: true, glassPart: 'sunroof' });
                    child.material = roofMat;
                    child.renderOrder = 0;
                    glassMeshes.push(child);

                    if (currentCarModelKey === 'model_3') {
                        // Model 3 썬루프는 Model Y 썬루프처럼 항상 고정으로 진하게 유지
                        child.userData = Object.assign({}, child.userData, {
                            windowSide: 0,
                            glassLayer: 'fixedDarkGlass'
                        });
                        model3FixedDarkGlassMeshes.push(child);
                        applyModel3FixedDarkGlassMaterial(roofMat);
                    } else {
                        // Model Y는 기존 로직 그대로 유지
                        glassMaterials.sunroof.push(roofMat);
                    }
                }
                else if (isRearOuterTint) {
                    const fixedTintMat = child.material.clone();
                    fixedTintMat.side = THREE.DoubleSide;
                    fixedTintMat.userData = Object.assign({}, fixedTintMat.userData, {
                        isFixedRearOuterTint: true,
                        glassPart: 'rear',
                        glassLayer: 'fixedDarkGlass'
                    });
                    child.userData = Object.assign({}, child.userData, {
                        windowSide: 0,
                        glassLayer: 'fixedDarkGlass'
                    });
                    child.material = fixedTintMat;
                    child.renderOrder = 29;
                    model3FixedDarkGlassMeshes.push(child);
                    glassMeshes.push(child);
                    applyModel3FixedDarkGlassMaterial(fixedTintMat);
                }
                else if (isGlassFilm) {
                    let filmPart = 'front';
                    if (glassKey.includes('glass_front1_film')) filmPart = 'row1';
                    else if (glassKey.includes('glass_front2_film')) filmPart = 'row2';
                    else if (glassKey.includes('glass_front3_film') || glassKey.includes('glass_quarter_film')) filmPart = 'row2';
                    else if (glassKey.includes('glass_rear_film')) filmPart = 'rear';

                    const filmWorldPos = new THREE.Vector3();
                    if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
                    child.geometry.boundingBox.getCenter(filmWorldPos).applyMatrix4(child.matrixWorld);
                    const filmSide = Math.abs(filmWorldPos.x) > 0.15 ? (filmWorldPos.x > 0 ? 1 : -1) : 0;

                    const filmMat = child.material.clone();
                    filmMat.side = THREE.DoubleSide;
                    filmMat.userData = Object.assign({}, filmMat.userData, {
                        isTintFilmLayer: true,
                        glassPart: filmPart,
                        windowSide: filmSide,
                        glassLayer: 'film'
                    });

                    // 새 Model 3 GLB의 3열 쿼터 필름은 glass_front3_film 한 오브젝트에
                    // 좌/우가 같이 들어 있으므로 런타임에서 좌/우를 분리한다.
                    if (glassKey.includes('glass_front3_film') && !glassKey.includes('filml') && !glassKey.includes('filmr')) {
                        const halves = splitSideOuterByWorldX(child, filmMat, 'film');
                        if (halves && halves.length === 2) {
                            meshesToHide.push(child);
                            halves.forEach(half => {
                                half.material.userData = Object.assign({}, half.material.userData, {
                                    isTintFilmLayer: true,
                                    glassPart: filmPart
                                });
                                meshesToAdd.push({ parent: child.parent, mesh: half });
                                glassMeshes.push(half);
                                glassMaterials[filmPart].push(half.material);
                            });
                        } else {
                            child.userData = Object.assign({}, child.userData, { windowSide: filmSide, glassLayer: 'film' });
                            child.material = filmMat;
                            child.renderOrder = 0;
                            glassMeshes.push(child);
                            glassMaterials[filmPart].push(filmMat);
                        }
                    } else {
                        child.userData = Object.assign({}, child.userData, { windowSide: filmSide, glassLayer: 'film' });
                        child.material = filmMat;
                        child.renderOrder = 0;
                        glassMeshes.push(child);
                        glassMaterials[filmPart].push(filmMat);
                    }
                }
                else if (isOuterGlass) {
                    let outerPart = 'front';
                    if (glassKey.includes('glass_front1_outer')) outerPart = 'row1';
                    else if (glassKey.includes('glass_front2_outer')) outerPart = 'row2';
                    else if (glassKey.includes('glass_front3_outer') || glassKey.includes('glass_quarter_outer')) outerPart = 'quarter';
                    else if (glassKey.includes('glass_rear_outer')) outerPart = 'rear';

                    const outerMat = child.material.clone();
                    outerMat.side = THREE.DoubleSide;
                    outerMat.userData = Object.assign({}, outerMat.userData, { outerGlassPart: outerPart });

                    // 측면 outer는 GLB에서 좌/우가 한 mesh이므로 런타임에 두 object로 분리해
                    // 카메라 거리 기준 transparent sorting이 각 창마다 따로 되게 한다.
                    if (['row1', 'row2', 'quarter'].includes(outerPart)) {
                        const halves = splitSideOuterByWorldX(child, outerMat);
                        if (halves && halves.length === 2) {
                            meshesToHide.push(child);
                            halves.forEach(half => {
                                meshesToAdd.push({ parent: child.parent, mesh: half });
                                glassMeshes.push(half);
                                outerGlassMeshes.push(half);
                            });
                        } else {
                            child.material = outerMat;
                            child.userData = Object.assign({}, child.userData, { windowSide: 0, glassLayer: 'outer' });
                            child.renderOrder = 0;
                            glassMeshes.push(child);
                            outerGlassMeshes.push(child);
                        }
                    } else {
                        child.material = outerMat;
                        child.userData = Object.assign({}, child.userData, { windowSide: 0, glassLayer: 'outer' });
                        child.renderOrder = 0;
                        glassMeshes.push(child);
                        outerGlassMeshes.push(child);
                    }
                }
                // headlights 등 다른 'glass' 재질은 건드리지 않는다.
            });

            meshesToHide.forEach(mesh => mesh.visible = false);
            meshesToAdd.forEach(item => {
                if (item.parent && item.mesh) item.parent.add(item.mesh);
            });

            scene.add(model);
            currentCarModel = model;
            model.updateMatrixWorld(true);

            const originPoint = new THREE.Vector3(0, 0.6, 0);

            // 차량 변경 시 현재 보고 있던 카메라 위치/방향을 그대로 유지한다.
            // 특히 내부 시점에서 Model 3 <-> Model Y 변경 시 카메라가 외부 기본 위치로
            // 초기화되어 차체 안쪽 엉뚱한 위치가 보이던 문제를 방지한다.
            if (preservedViewState) {
                camera.position.copy(preservedViewState.cameraPosition);
                controls.target.copy(preservedViewState.target);
                extCameraPos.copy(preservedViewState.extCameraPos);
                extTargetPos.copy(preservedViewState.extTargetPos);

                if (currentViewMode === 'interior') {
                    controls.minDistance = 0.01;
                    controls.maxDistance = 0.01;
                    controls.enableZoom = false;
                    controls.enablePan = false;
                    controls.rotateSpeed = -0.5;
                    controls.maxPolarAngle = Math.PI;
                } else {
                    controls.minDistance = 2;
                    controls.maxDistance = 10;
                    controls.enableZoom = true;
                    controls.enablePan = true;
                    controls.rotateSpeed = 1.0;
                    controls.maxPolarAngle = Math.PI / 2 - 0.03;
                }
                controls.update();
            } else {
                // 최초 로드만 기존 기본 외부 시점을 사용한다.
                controls.target.copy(originPoint);
                extTargetPos.copy(originPoint);
                extCameraPos.set(originPoint.x + 4, originPoint.y + 1.6, originPoint.z + 4);
                camera.position.copy(extCameraPos);
                controls.update();
            }

            if (carBodyMaterials.length > 0) {
                const activeColorBtn = document.querySelector('.color-btn.active');
                const selectedHex = activeColorBtn ? activeColorBtn.getAttribute('data-hex') : '#0f141e';
                const selectedColorName = activeColorBtn ? activeColorBtn.getAttribute('data-color') : '스텔스 그레이';
                applyBodyMaterialLook(selectedColorName, selectedHex);
            }

            const activeInteriorBtn = document.querySelector('.interior-btn.active');
            updateSeatColor(activeInteriorBtn && activeInteriorBtn.getAttribute('data-color') === 'white'
                ? WHITE_SEAT_COLOR
                : INTERIOR_TRIM_COLOR);
            updateAllGlassMaterials();
            updateModel3InteriorMatte();
            updateRoomMirrorTint();
            setupRoomMirrorReflection();

            loadingEl.style.display = 'none';
        } catch (err) {
            console.error('모델 처리 중 오류가 발생했습니다.', err);
            showLoadingMessage('모델 처리 오류: ' + (err.message || err));
        }
    }

    function updateModelSpecificColorButtons(modelKey) {
        const modelOnlyButtons = document.querySelectorAll('.color-btn[data-model-only]');

        modelOnlyButtons.forEach(btn => {
            const allowedModel = btn.getAttribute('data-model-only');
            const shouldShow = allowedModel === modelKey;
            btn.style.display = shouldShow ? '' : 'none';

            // 모델 Y 전용 색상이 선택된 상태에서 모델 3으로 바꾸면
            // 모델 3 기본 색상인 스텔스 그레이로 자동 복귀한다.
            if (!shouldShow && btn.classList.contains('active')) {
                btn.classList.remove('active');
                const fallbackBtn = document.querySelector('.color-btn[data-color="스텔스 그레이"]');
                if (fallbackBtn) {
                    fallbackBtn.classList.add('active');
                    const fallbackName = fallbackBtn.getAttribute('data-color');
                    const fallbackHex = fallbackBtn.getAttribute('data-hex');
                    const colorNameDisplayEl = document.getElementById('selected-color-name');
                    if (colorNameDisplayEl) colorNameDisplayEl.textContent = fallbackName;
                    applyBodyMaterialLook(fallbackName, fallbackHex);
                }
            }
        });
    }

    const MODEL_FILES = {
        model_y: 'glass_outer_filmgap.glb',
        model_3: 'tesla_model_3_2024_tint_ready.glb'
    };

    if (!THREE.GLTFLoader) {
        showLoadingMessage('GLTFLoader 로드 실패! 인터넷/CDN 연결을 확인해주세요.');
    } else {
        const gltfLoader = new THREE.GLTFLoader();

        function loadModelFile(modelKey) {
            const modelFile = MODEL_FILES[modelKey];
            if (!modelFile) return;

            updateModelSpecificColorButtons(modelKey);

            // 이미 차량이 표시 중이면 모델 교체 직전의 화면 위치를 저장한다.
            // 절대 카메라 좌표와 OrbitControls target을 그대로 복원하므로
            // 외부/내부 어느 시점에서 바꿔도 같은 구도로 다음 차량이 나타난다.
            const preservedViewState = currentCarModel ? {
                cameraPosition: camera.position.clone(),
                target: controls.target.clone(),
                extCameraPos: extCameraPos.clone(),
                extTargetPos: extTargetPos.clone()
            } : null;

            showLoadingMessage('차량 모델을 불러오는 중입니다');

            gltfLoader.load(modelFile,
                function (gltf) {
                    handleModelLoaded(gltf, preservedViewState, modelKey);
                },
                function (xhr) {
                    if (xhr.lengthComputable) {
                        loadingEl.innerText = '차량 모델을 불러오는 중입니다';
                    }
                },
                function (error) {
                    console.warn(modelFile + ' 로드 실패', error);
                    showLoadingMessage('GLB 로드 실패! ' + modelFile + ' 파일이 index.html과 같은 폴더에 있는지 확인해주세요.');
                }
            );
        }

        const modelSelect = document.getElementById('model-select');
        if (modelSelect) {
            modelSelect.addEventListener('change', () => {
                loadModelFile(modelSelect.value);
            });
            loadModelFile(modelSelect.value);
        } else {
            loadModelFile('model_y');
        }
    }

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        updateExteriorGlassLayering();

        if (currentViewMode === 'interior' && roomMirrorCubeCamera && roomMirrorMesh) {
            const mirrorPos = new THREE.Vector3();
            roomMirrorMesh.getWorldPosition(mirrorPos);
            roomMirrorCubeCamera.position.copy(mirrorPos);

            // 룸미러 자기 자신이 반사에 다시 잡히지 않도록 잠시 숨김
            roomMirrorMesh.visible = false;
            roomMirrorCubeCamera.update(renderer, scene);
            roomMirrorMesh.visible = true;
        }

        renderer.render(scene, camera);
    }
    animate();

    const colorBtns = document.querySelectorAll('.color-btn');
    const colorNameDisplay = document.getElementById('selected-color-name');

    function applyBodyMaterialLook(colorName, hexColor) {
        if (carBodyMaterials.length === 0) return;

        // 모든 외장 색상은 동일한 차체 재질/반사 조건을 사용하고 색상값만 바꾼다.
        const appliedHex = hexColor;

        carBodyMaterials.forEach(mat => {
            mat.color.set(appliedHex);
            if ('metalness' in mat) mat.metalness = 0.25;
            if ('roughness' in mat) mat.roughness = 0.45;
            if ('clearcoat' in mat) mat.clearcoat = 0.35;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.25;
            if ('envMapIntensity' in mat) mat.envMapIntensity = 1.0;
            mat.needsUpdate = true;
        });
    }

    colorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            colorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const colorName = e.target.getAttribute('data-color');
            const hexColor = e.target.getAttribute('data-hex');
            colorNameDisplay.textContent = colorName;

            applyBodyMaterialLook(colorName, hexColor);
        });
    });

    const interiorBtns = document.querySelectorAll('.interior-btn');
    interiorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            interiorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const interiorColor = e.target.getAttribute('data-color');
            if (interiorColor === 'white') {
                updateSeatColor(WHITE_SEAT_COLOR);
            } else {
                updateSeatColor(INTERIOR_TRIM_COLOR);
            }
        });
    });

    const cameraBtns = document.querySelectorAll('.camera-btn');
    let extCameraPos = new THREE.Vector3(4, 2, 5);
    let extTargetPos = new THREE.Vector3(0, 0.6, 0);

    cameraBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            cameraBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const viewMode = e.target.getAttribute('data-view');
            currentViewMode = viewMode;

            if (viewMode === 'exterior') {
                camera.position.copy(extCameraPos);
                controls.target.copy(extTargetPos);

                controls.minDistance = 2;
                controls.maxDistance = 10;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.rotateSpeed = 1.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;

                restoreExteriorGlassView();
            } else {
                extCameraPos.copy(camera.position);
                extTargetPos.copy(controls.target);

                const driverHeadPos = new THREE.Vector3(0.4, 1.4, 0.2); 
                controls.target.copy(driverHeadPos);
                
                camera.position.set(driverHeadPos.x, driverHeadPos.y + 0.0036, driverHeadPos.z - 0.01);
                
                controls.minDistance = 0.01;
                controls.maxDistance = 0.01;
                controls.enableZoom = false;
                controls.enablePan = false;
                controls.rotateSpeed = -0.5; 
                controls.maxPolarAngle = Math.PI;

                setInteriorGlassView();
            }

            updateModel3InteriorMatte();
            controls.update();
        });
    });

    const filmTypeBtns = document.querySelectorAll('.film-type-btn');
    filmTypeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filmTypeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentFilmType = e.target.getAttribute('data-type');
            if (currentViewMode === 'interior') {
                setInteriorGlassView();
            } else {
                updateAllGlassMaterials();
            }
        });
    });

    const tintGroups = document.querySelectorAll('.tint-options');
    tintGroups.forEach(group => {
        const buttons = group.querySelectorAll('.tint-btn');
        const partName = group.getAttribute('data-part');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const rawTintValue = e.target.getAttribute('data-value');
                const tintValue = rawTintValue === 'none' ? null : parseInt(rawTintValue, 10);
                glassTintValues[partName] = tintValue;

                if (partName === 'rear') {
                    updateRoomMirrorTint();
                }

                if (glassMaterials[partName]) {
                    if (currentViewMode === 'interior') {
                        setInteriorGlassView();
                    } else {
                        glassMaterials[partName].forEach(mat => {
                            applyGlassProperties(mat, partName, tintValue, currentFilmType);
                        });
                    }
                }
            });
        });
    });

    const timeBtns = document.querySelectorAll('.time-btn');
    const carDisplay = document.getElementById('car-display');

    timeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            timeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const timeMode = e.target.getAttribute('data-time');
            
            if (timeMode === 'day') {
                if (dayExrTexture) {
                    scene.environment = dayExrTexture;
                    createOrUpdateHdriBackground(dayExrTexture);
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0xffffff);
                }
                carDisplay.style.backgroundColor = '#ffffff';
                
                ambientLight.intensity = 0.08;
                dirLight.intensity = 0.75;
                topLight.intensity = 0.28;
                interiorLight.intensity = 0.08;
                
                if(dayExrTexture) {
                    renderer.toneMappingExposure = 1.0;
                }
                
                if(neonGroup) neonGroup.visible = false;
            } else {
                if (nightExrTexture) {
                    scene.environment = nightExrTexture;
                    createOrUpdateHdriBackground(nightExrTexture);
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0x0a0f1c);
                }
                carDisplay.style.backgroundColor = '#0a0f1c';
                
                ambientLight.intensity = 0.02;
                dirLight.intensity = 0.5;
                topLight.intensity = 0.1;
                interiorLight.intensity = 0.2;

                if(scene.environment) {
                    renderer.toneMappingExposure = 0.35;
                }

                if(neonGroup) neonGroup.visible = true;
            }
        });
    });

    (function setupMobileCarSticky() {
        const carDisplayMobile = document.getElementById('car-display');
        if (!carDisplayMobile) return;

        const mobileQuery = window.matchMedia('(max-width: 760px)');
        const placeholder = document.createElement('div');
        placeholder.className = 'mobile-car-placeholder';
        carDisplayMobile.insertAdjacentElement('afterend', placeholder);

        let stickyStartY = 0;
        let rafPending = false;

        function getStickyStart() {
            const anchor = carDisplayMobile.classList.contains('mobile-car-fixed')
                ? placeholder
                : carDisplayMobile;
            return anchor.getBoundingClientRect().top + window.scrollY;
        }

        function releaseSticky() {
            carDisplayMobile.classList.remove('mobile-car-fixed');
            placeholder.classList.remove('active');
            placeholder.style.height = '0px';
        }

        function measure() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const wasFixed = carDisplayMobile.classList.contains('mobile-car-fixed');
            if (wasFixed) {
                carDisplayMobile.classList.remove('mobile-car-fixed');
                placeholder.classList.remove('active');
                placeholder.style.height = '0px';
            }

            stickyStartY = carDisplayMobile.getBoundingClientRect().top + window.scrollY;
            updateSticky();
        }

        function updateSticky() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const shouldFix = window.scrollY >= stickyStartY;

            if (shouldFix) {
                if (!carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    const currentHeight = carDisplayMobile.getBoundingClientRect().height;
                    placeholder.style.height = currentHeight + 'px';
                    placeholder.classList.add('active');
                    carDisplayMobile.classList.add('mobile-car-fixed');
                }
            } else {
                if (carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    releaseSticky();
                }
            }
        }

        function onScroll() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                updateSticky();
                rafPending = false;
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            clearTimeout(window.__mobileCarStickyResizeTimer);
            window.__mobileCarStickyResizeTimer = setTimeout(measure, 120);
        });

        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', measure);
        } else if (mobileQuery.addListener) {
            mobileQuery.addListener(measure);
        }

        window.addEventListener('load', () => {
            setTimeout(measure, 150);
        });

        setTimeout(measure, 0);
    })();



    // 현재 선택된 틴팅 농도 정보를 하단에서 확인하고 텍스트 파일로 저장한다.
    window.addEventListener('DOMContentLoaded', function setupTintInfoSave() {
        const saveBtn = document.getElementById('tint-save-btn');
        const resultBox = document.getElementById('tint-save-result');
        const resultText = document.getElementById('tint-save-text');
        const downloadBtn = document.getElementById('tint-download-btn');
        const closeBtn = document.getElementById('tint-save-close-btn');
        const modelSelect = document.getElementById('model-select');

        if (!saveBtn || !resultBox || !resultText || !downloadBtn || !closeBtn) return;

        let latestTintInfo = '';

        function formatTint(value) {
            return value == null ? '없음' : value + '%';
        }

        function getCurrentTintInfo() {
            return [
                '1. 전면 농도: ' + formatTint(glassTintValues.front),
                '2. 측면 1열 농도: ' + formatTint(glassTintValues.row1),
                '3. 측면 2열 농도: ' + formatTint(glassTintValues.row2),
                '4. 후면 농도: ' + formatTint(glassTintValues.rear),
                '5. 썬루프 농도: ' + formatTint(glassTintValues.sunroof)
            ].join('\n');
        }

        saveBtn.addEventListener('click', () => {
            latestTintInfo = getCurrentTintInfo();
            resultText.textContent = latestTintInfo;
            resultBox.classList.add('show');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        downloadBtn.addEventListener('click', () => {
            latestTintInfo = getCurrentTintInfo();
            resultText.textContent = latestTintInfo;

            // 휴대폰에서도 글자가 크게 보이도록 텍스트 파일 대신 고해상도 PNG로 저장한다.
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const lines = latestTintInfo.split('\n');
            ctx.fillStyle = '#111111';
            ctx.textBaseline = 'top';
            ctx.font = '700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';

            const left = 90;
            const startY = 115;
            const lineGap = 125;

            lines.forEach((line, index) => {
                ctx.fillText(line, left, startY + (index * lineGap));
            });

            ctx.font = '900 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('윈도우 프리미엄필름 디코닉', canvas.width / 2, 860);

            const modelName = modelSelect && modelSelect.selectedOptions && modelSelect.selectedOptions[0]
                ? modelSelect.selectedOptions[0].textContent.trim().replace(/\s+/g, '_')
                : '테슬라';

            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = modelName + '_틴팅농도.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        closeBtn.addEventListener('click', () => {
            resultBox.classList.remove('show');
        });
    });

</script>

(function setupDesktopSidebarRelayout() {
    function moveControlsToSidebar() {
        const container = document.querySelector('.container');
        const leftPanel = document.querySelector('.left-panel');
        const rightPanel = document.querySelector('.right-panel');
        const tintCard = rightPanel ? rightPanel.querySelector('.card') : null;
        const optionsRow = leftPanel ? leftPanel.querySelector(':scope > .options-row') : null;
        const stageDeck = leftPanel ? leftPanel.querySelector(':scope > .stage-control-deck') : null;
        const saveSection = document.querySelector('.tint-save-section');
        if (!container || !rightPanel || !tintCard || !optionsRow || !stageDeck || !saveSection) return;
        if (document.getElementById('sidebar-brand-model-card')) return;

        container.classList.add('layout-sidebar-enhanced');

        const groups = Array.from(optionsRow.querySelectorAll(':scope > .option-group'));
        const brandGroup = groups[0];
        const modelGroup = groups[1];
        const interiorGroup = groups[2];
        const viewGroup = groups[3];

        const brandModelCard = document.createElement('div');
        brandModelCard.className = 'sidebar-control-card';
        brandModelCard.id = 'sidebar-brand-model-card';
        const brandModelGrid = document.createElement('div');
        brandModelGrid.className = 'sidebar-grid two-col';
        if (brandGroup) brandModelGrid.appendChild(brandGroup);
        if (modelGroup) brandModelGrid.appendChild(modelGroup);
        brandModelCard.appendChild(brandModelGrid);

        const colorBackgroundCard = document.createElement('div');
        colorBackgroundCard.className = 'sidebar-control-card';
        colorBackgroundCard.id = 'sidebar-color-background-card';
        colorBackgroundCard.appendChild(stageDeck);

        const interiorViewCard = document.createElement('div');

        interiorViewCard.id = 'sidebar-interior-view-card';
        const interiorViewGrid = document.createElement('div');
        interiorViewGrid.className = 'sidebar-grid two-col';
        if (interiorGroup) interiorViewGrid.appendChild(interiorGroup);
        if (viewGroup) interiorViewGrid.appendChild(viewGroup);

        rightPanel.insertBefore(brandModelCard, tintCard);
        rightPanel.insertBefore(colorBackgroundCard, tintCard);
        rightPanel.insertBefore(interiorViewCard, tintCard);
        rightPanel.appendChild(saveSection);

    if (document.readyState === 'loading') {

})();

        },
        {
            target: () => document.querySelector('.right-panel .card'),
            title: '썬팅 농도 선택',
            text: '전면·1열·2열·후면·썬루프에서 원하는 농도를 선택해주세요.',
            eventTarget: () => document.querySelector('.right-panel .card'),
            eventName: 'click',
            accept: (e) => !!e.target.closest('.tint-btn')
        },
        {
            target: () => document.getElementById('tint-save-btn'),
            title: '농도정보 저장하기',
            text: '선택한 썬팅 농도 정보를 이미지로 저장할 수 있습니다.',
            eventTarget: () => document.getElementById('tint-save-btn'),
            eventName: 'click'
        }
    ];

    const masks = {
        top: document.getElementById('diconic-guide-mask-top'),
        left: document.getElementById('diconic-guide-mask-left'),
        right: document.getElementById('diconic-guide-mask-right'),
        bottom: document.getElementById('diconic-guide-mask-bottom')
    };
    const tooltip = document.getElementById('diconic-guide-tooltip');
    const stepEl = document.getElementById('diconic-guide-step');
    const titleEl = document.getElementById('diconic-guide-title');
    const textEl = document.getElementById('diconic-guide-text');
    const hintEl = document.getElementById('diconic-guide-hint');
    const skipBtn = document.getElementById('diconic-guide-skip');
    const closeBtn = document.getElementById('diconic-guide-close');

    if (!tooltip || !stepEl || !titleEl || !textEl || !hintEl || !skipBtn || !closeBtn ||
        !masks.top || !masks.left || !masks.right || !masks.bottom) return;

    let currentIndex = -1;
    let currentTarget = null;
    let currentEventTarget = null;
    let currentHandler = null;
    let finished = false;
    let repositionTimer = null;

    const guideModelSelect = document.getElementById('model-select');
    let guideModelPlaceholder = null;
    let guideModelOriginalValue = guideModelSelect ? guideModelSelect.value : 'model_y';

    function prepareModelSelectionStep() {
        if (!guideModelSelect || guideModelPlaceholder) return;

        guideModelOriginalValue = guideModelSelect.value || 'model_y';

        guideModelPlaceholder = document.createElement('option');
        guideModelPlaceholder.value = '__guide_select_model__';
        guideModelPlaceholder.textContent = '모델 선택';
        guideModelPlaceholder.disabled = true;

        guideModelSelect.insertBefore(guideModelPlaceholder, guideModelSelect.firstChild);
        guideModelSelect.value = guideModelPlaceholder.value;
    }

    function cleanupModelSelectionStep() {
        if (!guideModelSelect || !guideModelPlaceholder) return;

        const stillPlaceholder = guideModelSelect.value === guideModelPlaceholder.value;
        guideModelPlaceholder.remove();
        guideModelPlaceholder = null;

        // 사용자가 실제 모델을 고르지 않고 안내를 넘기거나 닫은 경우
        // 화면 선택값만 원래 모델로 되돌린다. change 이벤트는 발생시키지 않는다.
        if (stillPlaceholder) {
            guideModelSelect.value = guideModelOriginalValue;
        }
    }

    function isMobileGuide() {
        return window.matchMedia('(max-width: 760px)').matches;
    }

    function setRect(el, left, top, width, height) {
        el.style.left = Math.max(0, left) + 'px';
        el.style.top = Math.max(0, top) + 'px';
        el.style.width = Math.max(0, width) + 'px';
        el.style.height = Math.max(0, height) + 'px';
        el.style.display = 'block';
    }

    function detachCurrentHandler() {
        if (currentEventTarget && currentHandler && currentIndex >= 0 && steps[currentIndex]) {
            currentEventTarget.removeEventListener(steps[currentIndex].eventName || 'click', currentHandler);
        }
        currentEventTarget = null;
        currentHandler = null;
    }

    function hideGuide() {
        detachCurrentHandler();

        if (currentIndex === 1) {
            cleanupModelSelectionStep();
        }

        Object.values(masks).forEach(el => {
            el.style.display = 'none';
        });
        tooltip.style.display = 'none';

        if (currentTarget) {
            currentTarget.classList.remove('diconic-guide-focus');
        }
        currentTarget = null;
    }

    function finishGuide() {
        finished = true;
        hideGuide();
        tooltip.classList.remove('guide-final-step');
        document.body.classList.remove('diconic-guide-active');
    }

    function positionGuide() {
        if (!currentTarget || finished) return;

        const r = currentTarget.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return;

        const pad = 9;
        const left = Math.max(0, r.left - pad);
        const top = Math.max(0, r.top - pad);
        const right = Math.min(window.innerWidth, r.right + pad);
        const bottom = Math.min(window.innerHeight, r.bottom + pad);

        setRect(masks.top, 0, 0, window.innerWidth, top);
        setRect(masks.left, 0, top, left, bottom - top);
        setRect(masks.right, right, top, window.innerWidth - right, bottom - top);
        setRect(masks.bottom, 0, bottom, window.innerWidth, window.innerHeight - bottom);

        tooltip.style.display = 'block';

        // 모바일은 안내창을 CSS로 화면 하단에 고정하므로 좌표 계산하지 않는다.
        if (isMobileGuide()) {
            tooltip.style.left = '';
            tooltip.style.top = '';
            return;
        }

        const tooltipRect = tooltip.getBoundingClientRect();
        const gap = 18;

        let tipLeft = Math.min(
            Math.max(12, left),
            Math.max(12, window.innerWidth - tooltipRect.width - 12)
        );
        let tipTop = bottom + gap;

        if (tipTop + tooltipRect.height > window.innerHeight - 12) {
            tipTop = top - tooltipRect.height - gap;
        }
        if (tipTop < 12) {
            tipTop = Math.max(12, (window.innerHeight - tooltipRect.height) / 2);
        }

        tooltip.style.left = tipLeft + 'px';
        tooltip.style.top = tipTop + 'px';
    }

    function bindAdvance(step) {
        currentEventTarget = step.eventTarget ? step.eventTarget() : currentTarget;
        if (!currentEventTarget) return;

        currentHandler = function(e) {
            if (step.accept && !step.accept(e)) return;

            setTimeout(() => {
                if (currentIndex >= steps.length - 1) {
                    // 마지막 '농도정보 저장하기'를 누르면 안내를 바로 닫지 않고
                    // 최종 안내 문구를 보여준다.
                    detachCurrentHandler();
                    stepEl.textContent = '안내 완료';
                    titleEl.textContent = '이처럼 차량을 설정해보세요';
                    textEl.textContent = '원하는 차량과 썬팅 농도를 직접 설정해 확인해보세요.';
                    hintEl.textContent = '안내를 종료하려면 오른쪽 X 버튼을 눌러주세요.';
                    skipBtn.textContent = '안내 종료';
                    tooltip.classList.add('guide-final-step');
                    tooltip.style.display = 'block';
                    positionGuide();
                } else {
                    showStep(currentIndex + 1);
                }
            }, 150);
        };

        currentEventTarget.addEventListener(step.eventName || 'click', currentHandler);
    }

    function showStep(index) {
        if (finished || index < 0 || index >= steps.length) return;

        hideGuide();
        currentIndex = index;

        if (index === 1) {
            prepareModelSelectionStep();
        }

        const step = steps[index];
        currentTarget = step.target();

        if (!currentTarget) {
            if (index < steps.length - 1) {
                showStep(index + 1);
            } else {
                finishGuide();
            }
            return;
        }

        stepEl.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(steps.length).padStart(2, '0');
        titleEl.textContent = step.title;
        textEl.textContent = step.text;
        hintEl.textContent = index === 0
            ? '차량을 터치하면 다음 안내로 이동합니다.'
            : '표시된 항목을 선택하면 다음 안내로 이동합니다.';

        tooltip.classList.toggle('guide-final-step', index === steps.length - 1);
        document.body.classList.add('diconic-guide-active');

        if (isMobileGuide()) {
            // sticky 차량 화면이 해제된 뒤 실제 버튼 좌표를 다시 계산해
            // 안내창 위쪽의 보기 좋은 위치로 맞춘다.
            requestAnimationFrame(() => {
                const rect = currentTarget.getBoundingClientRect();
                const targetTop = window.scrollY + rect.top;
                const desiredTop = Math.max(12, window.innerHeight * 0.18);
                window.scrollTo({
                    top: Math.max(0, targetTop - desiredTop),
                    behavior: 'auto'
                });
            });
        } else {
            currentTarget.scrollIntoView({
                behavior: 'smooth',
                block: 'center',
                inline: 'nearest'
            });
        }

        setTimeout(() => {
            if (!currentTarget || finished) return;
            currentTarget.classList.add('diconic-guide-focus');
            positionGuide();
            bindAdvance(step);
        }, isMobileGuide() ? 220 : 550);
    }

    skipBtn.addEventListener('click', () => {
        if (currentIndex >= steps.length - 1) {
            finishGuide();
        } else {
            showStep(currentIndex + 1);
        }
    });

    closeBtn.addEventListener('click', finishGuide);

    window.addEventListener('resize', () => {
        if (finished || !currentTarget) return;
        clearTimeout(repositionTimer);
        repositionTimer = setTimeout(positionGuide, 100);
    });

    window.addEventListener('scroll', () => {
        if (finished || !currentTarget) return;

        if (isMobileGuide()) {
            requestAnimationFrame(positionGuide);
        } else {
            clearTimeout(repositionTimer);
            repositionTimer = setTimeout(positionGuide, 100);
        }
    }, { passive: true });

    // 페이지 첫 실행 시 자동으로 1단계 안내 시작
    function autoStartGuide() {
        if (finished || currentIndex >= 0) return;
        setTimeout(() => showStep(0), 900);
    }

    if (document.readyState === 'complete') {
        autoStartGuide();
    } else {
        window.addEventListener('load', autoStartGuide, { once: true });
    }
})();
</script>

</body>
</html>
