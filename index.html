<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디코닉 차량 색상농도 확인 3D - Glass Gap Sort Fix v2</title>






    <style>
        :root {
            --primary-color: #172033;
            --accent-color: #2563eb;
            --bg-color: #f3f0ea;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-solid: #ffffff;
            --text-main: #20242c;
            --text-muted: #7c828d;
            --border-color: rgba(32, 36, 44, 0.10);
            --soft-bg: rgba(255,255,255,0.68);
            --shadow-soft: 0 18px 50px rgba(31, 35, 42, 0.10);
            --shadow-card: 0 12px 34px rgba(31, 35, 42, 0.09);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 26px;
            background:
                radial-gradient(circle at 38% 12%, rgba(255,255,255,0.96) 0, rgba(255,255,255,0.62) 24%, rgba(243,240,234,0) 50%),
                linear-gradient(180deg, #f7f5f1 0%, #efede8 100%);
        }

        .container {
            max-width: 1540px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            gap: 26px;
            align-items: start;
        }

        .left-panel {
            min-width: 0;
            position: relative;
        }

        .header-title {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            padding: 0 6px;
        }

        .header-title > div:first-child {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(25px, 2vw, 34px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .header-title p {
            margin: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 650;
        }

        .btn-share {
            border: 1px solid rgba(32,36,44,0.09);
            padding: 10px 17px;
            border-radius: 999px;
            background: rgba(255,255,255,0.82);
            color: var(--text-main);
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(31,35,42,0.05);
            backdrop-filter: blur(14px);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .btn-share:hover {
            transform: translateY(-1px);
            background: #fff;
            box-shadow: 0 10px 28px rgba(31,35,42,0.10);
        }

        .options-row {
            display: grid;
            grid-template-columns: 1fr 1.25fr auto auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            background: rgba(255,255,255,0.70);
            box-shadow: 0 10px 30px rgba(31,35,42,0.06);
            backdrop-filter: blur(20px);
        }

        .option-group {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .option-group label,
        .deck-label {
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .02em;
            color: #858a93;
        }

        select {
            width: 100%;
            min-width: 120px;
            height: 42px;
            padding: 0 34px 0 13px;
            border: 1px solid rgba(32,36,44,0.10);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.90);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }

        select:focus {
            border-color: rgba(37,99,235,0.55);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        .toggle-group {
            display: flex;
            gap: 5px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(31,35,42,0.055);
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            min-height: 34px;
            padding: 7px 13px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #737986;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
        }

        .time-btn:hover, .interior-btn:hover, .camera-btn:hover, .film-type-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.72);
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.18);
        }

        .time-btn[data-time="day"].active {
            background: #e3a315;
            color: #fff;
            box-shadow: 0 6px 16px rgba(227,163,21,0.22);
        }

        .interior-btn[data-color="black"].active {
            background: #20242c;
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.16);
        }

        .interior-btn[data-color="white"].active {
            background: white;
            color: #20242c;
            box-shadow: 0 5px 14px rgba(31,35,42,0.10);
        }

        .car-display {
            position: relative;
            width: 100%;
            height: min(67vh, 690px);
            min-height: 560px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #f1eee7 70%, #e9e6df 100%);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.75);
            transition: background-color 0.5s ease;
        }

        .car-display::after {
            content: "";
            position: absolute;
            inset: auto 7% 5% 7%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(31,35,42,.12), rgba(31,35,42,0) 70%);
            filter: blur(18px);
            pointer-events: none;
            z-index: 0;
        }

        #canvas-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }


        .car-touch-hint {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 18;
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.88);
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.01em;
            box-shadow: 0 10px 24px rgba(31,35,42,.12);
            backdrop-filter: blur(12px);
            pointer-events: none;
            white-space: nowrap;
            transition: opacity .25s ease, transform .25s ease;
        }

        .car-touch-hint.is-hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(8px);
        }

        .stage-control-deck {
            width: min(560px, calc(100% - 28px));
            margin: 12px 0 0 14px;
            height: 134px;
            min-height: 134px;
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 18px;
            align-items: center;
            padding: 13px 16px 13px 20px;
            border: 1px solid rgba(255,255,255,0.80);
            border-radius: 24px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 18px 38px rgba(31,35,42,0.13);
            backdrop-filter: blur(20px);
        }

        .deck-section {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .deck-divider {
            width: 1px;
            height: 42px;
            background: rgba(32,36,44,0.10);
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 38px);
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex: 0 0 auto;
        }

        .color-control-row {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .selected-color-name {
            margin: 0;
            flex: 0 0 auto;
            font-size: 13px;
            font-weight: 800;
            color: #555b65;
            white-space: nowrap;
        }

        /* PC에서 '차량 컬러' 글자만 조금 위로 */
        .stage-control-deck > .deck-section:first-child > .deck-label {
            position: relative;
            top: -8px;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.95);
            cursor: pointer;
            outline: 1px solid rgba(31,35,42,0.14);
            outline-offset: 2px;
            box-shadow: 0 4px 10px rgba(31,35,42,0.10);
            transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
        }

        .color-btn:hover { transform: translateY(-2px) scale(1.04); }

        .color-btn.active {
            transform: translateY(-2px) scale(1.08);
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
            box-shadow: 0 7px 17px rgba(31,35,42,0.16);
        }

        .right-panel {
            width: 390px;
            position: sticky;
            top: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(22px);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 19px;
            letter-spacing: -0.3px;
        }

        .product-select {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding: 17px;
            border: 1px solid rgba(37,99,235,0.28);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(238,245,255,.98), rgba(255,255,255,.96));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        }

        .product-select::after {
            content: "SELECTED";
            position: absolute;
            right: 14px;
            top: 13px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .11em;
            color: var(--accent-color);
            opacity: .75;
        }

        .product-select input[type="checkbox"] {
            width: 20px !important;
            height: 20px !important;
            accent-color: var(--accent-color) !important;
        }

        .film-type-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 17px;
            padding-bottom: 17px;
            border-bottom: 1px solid rgba(32,36,44,0.08);
        }

        .film-type-row .toggle-group { width: 100%; }
        .film-type-row .film-type-btn { flex: 1; }

        /* 반사 필름은 기능은 유지하고 현재 화면에서만 숨김 */
        .film-type-btn[data-type="reflective"] {
            display: none !important;
        }

        .tint-row {
            display: grid;
            grid-template-columns: 46px minmax(0,1fr);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tint-row:last-child { margin-bottom: 0; }

        .tint-label {
            width: auto;
            font-weight: 800;
            font-size: 13px;
            color: #3f4650;
        }

        .tint-options {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .tint-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            max-width: 42px;
            justify-self: center;
            border-radius: 50%;
            border: 1px solid transparent;
            background: #f0f1f3;
            color: #858b96;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
        }

        .tint-btn:hover {
            transform: translateY(-1px);
            background: #e5e7eb;
            color: #535964;
        }

        .tint-btn.active {
            transform: translateY(-1px);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 7px 15px rgba(37,99,235,.22);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-color);
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,.84);
            box-shadow: 0 8px 22px rgba(31,35,42,.08);
            backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 30;
        }

        @media (max-width: 1180px) {
            body { padding: 18px; }
            .container { grid-template-columns: 1fr; max-width: 1050px; }
            .right-panel { width: 100%; position: static; }
            .card { padding: 22px; }
            .car-display { height: 620px; }
            .tint-options { grid-template-columns: repeat(7, minmax(34px, 40px)); justify-content: start; }
        }

        @media (max-width: 760px) {
            .car-touch-hint {
                bottom: 16px;
                font-size: 13px;
                padding: 11px 16px;
                max-width: calc(100% - 28px);
                text-align: center;
                white-space: normal;
            }
            body { padding: 12px; }
            .container { display: block; max-width: none; }
            .left-panel { display: block; min-width: 0; }
            .header-title { min-height: auto; margin: 0 0 10px; padding: 8px 3px 2px; }
            .header-title h1 { font-size: 22px; }
            .header-title p { width: 100%; font-size: 13px; }
            .btn-share { padding: 9px 13px; }
            .options-row { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; padding: 11px; }
            
            .car-display {
                width: 100%;
                height: 58vh;
                min-height: 430px;
                max-height: 780px;
                margin: 0;
                border-radius: 20px;
                box-shadow: 0 14px 36px rgba(31,35,42,0.16);
            }

            .car-display.mobile-car-fixed {
                position: fixed !important;
                top: 0 !important;
                left: 12px !important;
                right: 12px !important;
                width: auto !important;
                z-index: 5000 !important;
                margin: 0 !important;
                border-radius: 0 0 20px 20px;
                box-shadow: 0 16px 38px rgba(31,35,42,0.22);
            }

            .mobile-car-placeholder { display: none; width: 100%; }
            .mobile-car-placeholder.active { display: block; }

            .stage-control-deck {
                width: 100%; margin: 12px 0 14px; grid-template-columns: 1fr; gap: 12px; border-radius: 20px; padding: 14px;
                height: auto; min-height: 0;
            }

            /* 모바일에서 배경(낮/밤)을 차량 컬러보다 먼저 표시 */
            .stage-control-deck > .deck-section:last-child { order: 1; }
            .stage-control-deck > .deck-section:first-child { order: 2; }

            .deck-divider { display: none; }
            .stage-control-deck .toggle-group { justify-self: stretch; width: 100%; }
            .stage-control-deck .time-btn { flex: 1; }
            .color-palette { grid-template-columns: repeat(5, 34px); gap: 10px; width: auto; }
            .color-control-row { flex-direction: column; align-items: flex-start; gap: 9px; width: 100%; }
            .selected-color-name { font-size: 12px; padding-left: 2px; }
            .stage-control-deck > .deck-section:first-child > .deck-label { top: 0; }
            .color-btn { width: 34px; height: 34px; flex-basis: 34px; }
            
            .right-panel { width: 100%; margin-top: 0; position: static; }
            .card { border-radius: 22px; padding: 18px 14px 28px; }
            .film-type-row .toggle-group { width: 100%; }
            .tint-row { grid-template-columns: 42px minmax(0,1fr); gap: 6px; }
            .tint-options { gap: 4px; grid-template-columns: repeat(7, 1fr); }
            .tint-btn { max-width: 40px; font-size: 10px; }
        }

        .option-group .toggle-group:has(.interior-btn),
        .option-group .toggle-group:has(.camera-btn),
        .stage-control-deck .toggle-group,
        .film-type-row .toggle-group {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .interior-btn, .camera-btn, .time-btn, .film-type-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn.active, .camera-btn.active, .film-type-btn.active,
        .interior-btn[data-color="black"].active, .interior-btn[data-color="white"].active,
        .time-btn.active, .time-btn[data-time="day"].active, .time-btn[data-time="night"].active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn:hover, .camera-btn:hover, .time-btn:hover, .film-type-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .interior-btn.active:hover, .camera-btn.active:hover, .time-btn.active:hover, .film-type-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }

        .tint-btn {
            background: #f3f3f3 !important;
            color: #666666 !important;
            border: 1px solid #ececec !important;
            box-shadow: none !important;
        }

        .tint-btn:hover { background: #ebebeb !important; color: #222222 !important; box-shadow: none !important; }
        .tint-btn.active { background: #111111 !important; color: #ffffff !important; border: 1px solid #111111 !important; box-shadow: none !important; }

        .product-select { background: #ffffff !important; border: 1px solid #dddddd !important; box-shadow: none !important; }

        /* 제품 선택 박스는 기능은 유지하고 현재 화면에서만 숨김 */
        .product-select {
            display: none !important;
        }
        .product-select::after { color: #666666 !important; }
        .product-select input[type="checkbox"] {
    display: none !important;
}

        .left-panel > .car-display + .options-row { margin-top: 14px !important; margin-bottom: 14px !important; }


        /* ===== Desktop right-sidebar relayout (controls moved neatly under tint area) ===== */
        .container.layout-sidebar-enhanced {
            grid-template-columns: minmax(0, 1fr) 410px;
            gap: 24px;
        }
        .layout-sidebar-enhanced .left-panel > .options-row,
        .layout-sidebar-enhanced .left-panel > .stage-control-deck {
            display: none !important;
        }
        .layout-sidebar-enhanced .right-panel {
            width: 410px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .layout-sidebar-enhanced .right-panel .card,
        .layout-sidebar-enhanced .right-panel .sidebar-control-card {
            width: 100%;
            box-sizing: border-box;
        }
        .layout-sidebar-enhanced .sidebar-control-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(22px);
        }
        .layout-sidebar-enhanced .sidebar-grid {
            display: grid;
            gap: 14px;
        }
        .layout-sidebar-enhanced .sidebar-grid.two-col {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .layout-sidebar-enhanced .sidebar-grid.one-col {
            grid-template-columns: minmax(0, 1fr);
        }
        .layout-sidebar-enhanced .sidebar-control-card .option-group {
            gap: 8px;
        }
        .layout-sidebar-enhanced .sidebar-control-card .toggle-group {
            width: 100%;
        }
        .layout-sidebar-enhanced .sidebar-control-card .toggle-group > button,
        .layout-sidebar-enhanced .sidebar-control-card select {
            width: 100%;
        }
        .layout-sidebar-enhanced .sidebar-control-card select {
            min-width: 0;
        }
        .layout-sidebar-enhanced .right-panel .stage-control-deck {
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: stretch;
            width: 100%;
            height: auto;
            min-height: 0;
            overflow: visible;
        }
        .layout-sidebar-enhanced .right-panel .deck-divider {
            display: none;
        }
        .layout-sidebar-enhanced .right-panel .deck-section {
            min-width: 0;
            width: 100%;
        }
        .layout-sidebar-enhanced #sidebar-color-background-card .deck-section:last-child {
            display: flex !important;
            order: 1 !important;
            align-self: stretch;
            width: 100%;
            flex-direction: column;
            gap: 8px;
        }
        .layout-sidebar-enhanced #sidebar-color-background-card .deck-section:last-child .toggle-group {
            width: 100%;
            display: flex;
        }
        .layout-sidebar-enhanced #sidebar-color-background-card .deck-section:last-child .time-btn {
            flex: 1 1 0;
            min-width: 0;
            padding-left: 8px;
            padding-right: 8px;
        }
        .layout-sidebar-enhanced #sidebar-color-background-card .deck-section:first-child {
            order: 2 !important;
            width: 100%;
        }
        .layout-sidebar-enhanced .right-panel .color-control-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            width: 100%;
        }
        .layout-sidebar-enhanced .right-panel .color-palette {
            width: 100%;
            max-width: 100%;
            flex-wrap: wrap;
            gap: 10px;
        }
        .layout-sidebar-enhanced .right-panel .selected-color-name {
            margin: 0;
            font-size: 16px;
            line-height: 1.2;
        }
        .layout-sidebar-enhanced .right-panel .card h2 {
            margin-bottom: 16px;
        }
        .layout-sidebar-enhanced .right-panel .tint-save-section {
            max-width: none;
            width: 100%;
            margin: 0;
            align-items: stretch;
        }
        .layout-sidebar-enhanced .right-panel .tint-save-btn {
            width: 100%;
            height: 56px;
            font-size: 18px;
            border-radius: 18px;
        }
        .layout-sidebar-enhanced .right-panel .tint-save-result {
            width: 100%;

<script>
    window.addEventListener('error', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '스크립트 오류: ' + (e.message || '알 수 없는 오류');
        }
        console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '로드 오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
        console.error(e.reason);
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.sortObjects = true; // v2: transparent glass/film uses camera-depth sorting
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0; 
    container.appendChild(renderer.domElement);

    const carTouchHint = document.getElementById('car-touch-hint');
    function hideCarTouchHint() {
        if (!carTouchHint) return;
        carTouchHint.classList.add('is-hidden');
        window.setTimeout(function () {
            if (carTouchHint) carTouchHint.style.display = 'none';
        }, 260);
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;

    renderer.domElement.addEventListener('wheel', hideCarTouchHint, { passive: true });
    renderer.domElement.addEventListener('touchstart', hideCarTouchHint, { passive: true });

    // 모바일 멀티터치 안전 처리:
    // 차량을 드래그/회전하는 손가락이 눌려 있는 동안 다른 손가락으로
    // 버튼/셀렉트/색상 버튼을 동시에 누르면 UI 입력만 잠시 무시한다.
    // OrbitControls와 UI 이벤트가 동시에 실행되며 상태가 충돌하는 것을 방지한다.
    (function setupVehicleMultiTouchGuard() {
        const vehiclePointerIds = new Set();
        let fallbackTouchActive = false;

        function isUiControlTarget(target) {
            if (!target || !target.closest) return false;
            return !!target.closest(
                'button, select, .color-btn, .tint-btn, .interior-btn, .camera-btn, .time-btn, .film-type-btn, .tint-save-section'
            );
        }

        function vehicleInputActive() {
            return vehiclePointerIds.size > 0 || fallbackTouchActive;
        }

        renderer.domElement.addEventListener('pointerdown', function(e) {
            vehiclePointerIds.add(e.pointerId);
            hideCarTouchHint();
        }, true);

        function releasePointer(e) {
            if (e && e.pointerId != null) {
                vehiclePointerIds.delete(e.pointerId);
            }
        }

        window.addEventListener('pointerup', releasePointer, true);
        window.addEventListener('pointercancel', releasePointer, true);

        // PointerEvent 미지원 환경용 보조 처리
        renderer.domElement.addEventListener('touchstart', function() {
            fallbackTouchActive = true;
        }, { passive: true, capture: true });

        window.addEventListener('touchend', function() {
            fallbackTouchActive = false;
        }, { passive: true, capture: true });

        window.addEventListener('touchcancel', function() {
            fallbackTouchActive = false;
        }, { passive: true, capture: true });

        // 차량 조작 중 두 번째 손가락의 UI 입력은 실행 전에 차단
        document.addEventListener('pointerdown', function(e) {
            if (!vehicleInputActive()) return;
            if (e.target === renderer.domElement || renderer.domElement.contains(e.target)) return;
            if (!isUiControlTarget(e.target)) return;

            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }
        }, true);

        document.addEventListener('click', function(e) {
            if (!vehicleInputActive()) return;
            if (!isUiControlTarget(e.target)) return;

            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }
        }, true);

        document.addEventListener('change', function(e) {
            if (!vehicleInputActive()) return;
            if (!isUiControlTarget(e.target)) return;

            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
            }
        }, true);

        // 앱 전환/포커스 이탈 시 입력 상태가 남지 않도록 초기화
        window.addEventListener('blur', function() {
            vehiclePointerIds.clear();
            fallbackTouchActive = false;
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                vehiclePointerIds.clear();
                fallbackTouchActive = false;
            }
        });
    })();

    let dayExrTexture = null;
    let nightExrTexture = null;
    let hdriBackgroundSphere = null;
    const HDRI_ROTATION_Y = Math.PI * 0.35;

    function createOrUpdateHdriBackground(texture) {
        if (!texture) return;
        if (hdriBackgroundSphere) {
            scene.remove(hdriBackgroundSphere);
            if (hdriBackgroundSphere.geometry) hdriBackgroundSphere.geometry.dispose();
            if (hdriBackgroundSphere.material) {
                if (hdriBackgroundSphere.material.map) hdriBackgroundSphere.material.map.dispose();
                hdriBackgroundSphere.material.dispose();
            }
            hdriBackgroundSphere = null;
        }

        const bgTexture = texture.clone();
        bgTexture.mapping = THREE.UVMapping;
        bgTexture.needsUpdate = true;

        const bgGeometry = new THREE.SphereGeometry(50, 64, 32);
        const bgMaterial = new THREE.MeshBasicMaterial({
            map: bgTexture,
            side: THREE.BackSide
        });

        hdriBackgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
        hdriBackgroundSphere.rotation.y = HDRI_ROTATION_Y;
        hdriBackgroundSphere.frustumCulled = false;
        hdriBackgroundSphere.renderOrder = -1000;
        scene.add(hdriBackgroundSphere);
        scene.background = null;
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.08);

    scene.add(dirLight);
    const topLight = new THREE.DirectionalLight(0xffffff, 0.28);
    topLight.position.set(0, 10, 0);

    let carBodyMaterials = []; 
    let interiorMaterial = null;

    // Model 3의 실내에서만 반짝임을 없앨 공유 트림 재질(Object_28/Object_30 계열).
    // 외부 시점에서는 원래 재질값을 그대로 복원한다.
    let model3InteriorMatteMaterials = [];
    let glassMaterials = { front: [], row1: [], row2: [], rear: [], sunroof: [] };
    let glassMeshes = [];
    let outerGlassMeshes = [];
    let model3FixedDarkGlassMeshes = [];
    let glassBorderMeshes = [];
    let roomMirrorMaterials = [];
    let roomMirrorMesh = null;

    let glassTintValues = { front: null, row1: null, row2: null, rear: null, sunroof: null };
    let currentFilmType = 'non-reflective';

    const DEFAULT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/ulmer_muenster_2k.exr';
    const NIGHT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/hansaplatz_2k.exr';
    if (THREE.EXRLoader) {
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load(DEFAULT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            dayExrTexture = texture;
            scene.environment = dayExrTexture;
            createOrUpdateHdriBackground(dayExrTexture);
            updateAllGlassMaterials();
            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => mat.needsUpdate = true);
            }
        }, undefined, function(error) {
            console.warn('HDRI 로드 실패', error);
            scene.background = new THREE.Color(0xffffff);
        });

        exrLoader.load(NIGHT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            nightExrTexture = texture;

            const activeNightBtn = document.querySelector('.time-btn[data-time="night"].active');
            if (activeNightBtn) {
                scene.environment = nightExrTexture;
                createOrUpdateHdriBackground(nightExrTexture);

            }
        }, undefined, function(error) {

    function setupNeonLights() {
        neonGroup = new THREE.Group();
        const xOffsets = [-2.5, 2.5];
        const zPositions = [-3.0, -1.0, 1.0, 3.0];
        xOffsets.forEach(x => {
            zPositions.forEach(z => {
                const light = new THREE.PointLight(0xffffff, 0.5, 4);
                light.position.set(x, 1.25, z);
                neonGroup.add(light);
            });
        });
        const ambientFill = new THREE.PointLight(0xffffff, 0.3, 10);
        ambientFill.position.set(0, 4, 0);
        neonGroup.add(ambientFill);
        scene.add(neonGroup);
        neonGroup.visible = false;
    }
    setupNeonLights();

    const INTERIOR_TRIM_COLOR = 0x050505; 
    const WHITE_SEAT_COLOR = 0x464644;    

    function applyInteriorMatte(mat) {
        if (!mat) return;
        mat.metalness = 0.0;
        mat.roughness = 1.0;
        mat.envMapIntensity = 0.0;
        if ('clearcoat' in mat) mat.clearcoat = 0.0;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
        mat.needsUpdate = true;
    }


    // Model 3의 빨간 체크 영역(천장/필러/대시 상단/도어 패널)은
    // 원본 GLB에서 휠 계열 재질명으로 합쳐져 있어 일반 실내 판별에 잡히지 않는다.
    // 실내 시점에서만 Model Y와 같은 무광값을 적용하고, 외부 시점에서는 원래 값으로 되돌린다.
    function registerModel3InteriorMatteMaterial(mat) {
        if (!mat) return;
        mat.userData = Object.assign({}, mat.userData, {
            model3InteriorMatteOriginal: {
                metalness: mat.metalness,
                roughness: mat.roughness,
                envMapIntensity: mat.envMapIntensity,
                clearcoat: ('clearcoat' in mat) ? mat.clearcoat : undefined,
                clearcoatRoughness: ('clearcoatRoughness' in mat) ? mat.clearcoatRoughness : undefined
            }
        });
        model3InteriorMatteMaterials.push(mat);
    }

    function updateModel3InteriorMatte() {
        const useMatte = currentViewMode === 'interior';
        model3InteriorMatteMaterials.forEach(mat => {
            if (!mat) return;
            const original = mat.userData && mat.userData.model3InteriorMatteOriginal;
            if (useMatte) {
                // Model Y 실내 트림과 동일한 무광 기준. 색상은 건드리지 않는다.
                mat.metalness = 0.0;
                mat.roughness = 1.0;
                mat.envMapIntensity = 0.0;
                if ('clearcoat' in mat) mat.clearcoat = 0.0;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
            } else if (original) {
                mat.metalness = original.metalness;
                mat.roughness = original.roughness;
                mat.envMapIntensity = original.envMapIntensity;
                if ('clearcoat' in mat && original.clearcoat !== undefined) mat.clearcoat = original.clearcoat;
                if ('clearcoatRoughness' in mat && original.clearcoatRoughness !== undefined) {
                    mat.clearcoatRoughness = original.clearcoatRoughness;
                }
            }
            mat.needsUpdate = true;
        });
    }

    // ★ 누락되었던 실내 색상 반영 함수들 복구!
    function setInteriorTrimBase() {
        interiorTrimMaterials.forEach(mat => {
            mat.color.setHex(INTERIOR_TRIM_COLOR);
            applyInteriorMatte(mat);
        });
    }

    function updateSeatColor(colorHex) {
        setInteriorTrimBase();
        const wantsBlack = colorHex === INTERIOR_TRIM_COLOR;

        if (seatMaterials.length > 0) {
            seatMaterials.forEach(mat => {
                // Model 3 원본의 흰색 시트 재질(Ln7Mtl)은 별도 처리한다.
                // 화이트 선택 시 원래 밝은 색/표면값을 복원하고,
                // 블랙 선택 시 색만 자연스럽게 어둡게 바꾼다.
                if (mat.userData && mat.userData.isModel3Seat) {
                    if (wantsBlack) {
                        mat.color.setHex(0x050505);
                        mat.metalness = 0.0;
                        mat.roughness = 0.72;
                        mat.envMapIntensity = 0.04;
                        if ('clearcoat' in mat) mat.clearcoat = 0.02;
                        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.62;
                    } else {
                        // Model 3 화이트도 Model Y와 완전히 같은 색상/무광 재질을 사용한다.
                        mat.color.setHex(WHITE_SEAT_COLOR);
                        applyInteriorMatte(mat);
                    }
                    mat.needsUpdate = true;
                    return;
                }

                // Model Y는 기존 로직 유지
                mat.color.setHex(colorHex);
                applyInteriorMatte(mat);
            });
        } else if (interiorMaterial) {
            interiorMaterial.color.setHex(colorHex);
            applyInteriorMatte(interiorMaterial);
        }
    }

    // 바깥유리 셋팅
    function applyOuterGlassMaterial(mat) {
        if (!mat) return;
        const userData = mat.userData || {};
        const outerPart = userData.outerGlassPart || 'front';

        mat.side = THREE.DoubleSide;
        mat.transparent = true;
        mat.depthTest = true;
        mat.depthWrite = false;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.alphaTest = 0.0;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.polygonOffset = false;

        // Model 3의 전면/1열/2열/3열/후면 바깥유리는
        // 현재 Model 3 비반사 필름 70%와 같은 화면 재질값을 기본 유리 농도로 사용한다.
        // glass_roof_panorama / glass_rear_outertint는 이 함수 대상이 아니므로 기존 고정 진하기 유지.
        const useModel3Outer70 = currentCarModelKey === 'model_3' &&
            ['front', 'row1', 'row2', 'quarter', 'rear'].includes(outerPart);

        if (useModel3Outer70) {
            if (currentViewMode === 'interior') {
                // 현재 70% 필름의 내부 시점 값과 동일
                mat.color.setHex(0x080a0a);
                mat.opacity = 0.020;
                mat.metalness = 0.0;
                mat.roughness = 0.36;
                mat.envMapIntensity = 0.015;
                if ('clearcoat' in mat) mat.clearcoat = 0.0;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.55;
            } else {
                // 현재 Model 3 비반사 70% 외부 시점 값과 동일
                mat.color.setHex(0x030404);
                mat.opacity = 0.32;
                mat.metalness = 0.0;
                mat.roughness = 0.12;
                mat.envMapIntensity = 0.08;
                if ('clearcoat' in mat) mat.clearcoat = 0.08;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
            }
        } else {
            // Model Y 및 기타 유리는 기존 값 그대로 유지
            mat.color.setHex(0xffffff);

            if (currentViewMode === 'interior') {
                mat.opacity = 0.004;
                mat.metalness = 0.0;
                mat.roughness = 0.26;
                mat.envMapIntensity = 0.018;
                if ('clearcoat' in mat) mat.clearcoat = 0.015;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.42;
            } else {
                const sideGlass = ['row1', 'row2', 'quarter', 'rear'].includes(outerPart);

                if (sideGlass) {
                    mat.opacity = 0.010;
                    mat.roughness = 0.13;
                    mat.envMapIntensity = 0.11;
                    if ('clearcoat' in mat) mat.clearcoat = 0.08;
                    if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.18;
                } else {
                    // 전면 바깥유리
                    mat.opacity = 0.07;
                    mat.roughness = 0.08;
                    mat.envMapIntensity = 0.25;
                    if ('clearcoat' in mat) mat.clearcoat = 0.18;
                    if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.10;
                }
            }
        }

        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.001;

        mat.userData = Object.assign({}, mat.userData, { baseOpacity: mat.opacity, glassLayer: 'outer' });
        mat.needsUpdate = true;
    }

    // 테두리 셋팅
    function applyGlassBorderMaterial(mat) {
        if (!mat) return;
        const isInteriorView = currentViewMode === 'interior';

        // v4 핵심: glass_border는 투명 레이어가 아니다.
        // 먼저 깊이 버퍼에 기록해서 그 뒤의 film/outer가 테두리 위로 덮이지 않게 한다.
        mat.side = THREE.DoubleSide;
        mat.color.setHex(isInteriorView ? 0x070707 : 0x050505);
        mat.transparent = false;
        mat.opacity = 1.0;
        mat.alphaTest = 0.0;
        mat.depthTest = true;
        mat.depthWrite = true;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;

        mat.metalness = 0.0;
        mat.roughness = isInteriorView ? 0.68 : 0.48;
        mat.envMapIntensity = isInteriorView ? 0.015 : 0.025;
        mat.reflectivity = 0.0;

        if ('clearcoat' in mat) mat.clearcoat = isInteriorView ? 0.01 : 0.05;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.68;
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.0;
        if ('thickness' in mat) mat.thickness = 0.0;

        mat.polygonOffset = false;
        mat.needsUpdate = true;
    }

    // 썬팅 필름 셋팅
    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        // v2: 한 개의 물리적으로 분리된 필름면을 양면 렌더링한다.
        // 같은 geometry를 FrontSide/BackSide로 복제하지 않아 농도 중첩을 방지한다.
        mat.side = THREE.DoubleSide;
        mat.transparent = true;
        mat.depthWrite = false;
        mat.depthTest = true;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.alphaTest = 0.0;
        mat.polygonOffset = false;

        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.001;

        // '없음' 선택:
        // 전면/1열/2열/후면은 썬팅 필름 효과를 제거한다.
        // 썬루프 '없음'은 썬루프 전용 5% 가중치를 쓰지 않고,
        // 일반 측면 5%와 같은 농도 계산을 사용한다.
        const isSunroofNone = (partName === 'sunroof' && tintValue == null);

        if (tintValue == null) {
            if (isSunroofNone) {
                tintValue = 5;
            } else {
                mat.color.setHex(0xffffff);
                mat.opacity = 0.08;
                mat.metalness = 0.0;
                mat.roughness = 0.0;
                mat.envMapIntensity = 0.0;
                if ('clearcoat' in mat) mat.clearcoat = 0.0;
                if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
                mat.userData = Object.assign({}, mat.userData, { baseOpacity: 0.08, glassLayer: 'film' });
                mat.needsUpdate = true;
                return;
            }
        }

        // 화면용 농도. 가까운 창 + 실내 + 반대편 창의 깊이감이 남도록 설정.
        let opacityValue;
        if (tintValue >= 70) opacityValue = 0.28;
        else if (tintValue >= 50) opacityValue = 0.48;
        else if (tintValue >= 30) opacityValue = 0.63;
        else if (tintValue >= 22) opacityValue = 0.72;
        else if (tintValue >= 15) opacityValue = 0.77;
        else opacityValue = 0.90;

        if (partName === 'sunroof' && !isSunroofNone) {
            if (tintValue >= 70) opacityValue = 0.42;
            else if (tintValue >= 50) opacityValue = 0.50;
            else if (tintValue >= 30) opacityValue = 0.59;
            else if (tintValue >= 22) opacityValue = 0.66;
            else if (tintValue >= 15) opacityValue = 0.72;
            else opacityValue = 0.82;
        }

        if (currentViewMode === 'interior') {
            if (partName === 'sunroof' && !isSunroofNone) {
                if (tintValue >= 70) {
                    opacityValue = 0.23;
                } else if (tintValue >= 50) {
                    opacityValue = 0.35;
                } else {
                    opacityValue = Math.max(0.42, opacityValue - 0.16);
                }
            } else {
                if (tintValue >= 70) opacityValue = 0.020;
                else if (tintValue >= 50) opacityValue = 0.036;
                else if (tintValue >= 30) opacityValue = 0.090;
                else if (tintValue >= 22) opacityValue = 0.100;
                else if (tintValue >= 15) opacityValue = 0.135;
                else opacityValue = 0.20;
            }
        }

        // Model 3는 같은 숫자 농도에서도 Model Y보다 실내가 조금 더 밝게 비쳐 보여
        // 외부 시점에서만 각 농도별 체감을 Model Y와 비슷하게 맞춘다.
        const isModel3ExteriorTint = currentCarModelKey === 'model_3'
            && currentViewMode === 'exterior'
            && partName !== 'sunroof'
            && tintValue != null;

        function getModel3MatchedOpacity(baseValue, reflectiveMode) {
            if (!isModel3ExteriorTint) {
                return reflectiveMode ? Math.min(baseValue * 0.95, 0.88) : (baseValue * 0.90);
            }

            if (reflectiveMode) {
                if (tintValue >= 70) return 0.31;
                if (tintValue >= 50) return 0.50;
                if (tintValue >= 30) return 0.66;
                if (tintValue >= 22) return 0.75;
                if (tintValue >= 15) return 0.82;
                return 0.94; // 5%
            }

            if (tintValue >= 70) return 0.32;
            if (tintValue >= 50) return 0.52;
            if (tintValue >= 30) return 0.69;
            if (tintValue >= 22) return 0.78;
            if (tintValue >= 15) return 0.84;
            return 0.96; // 5%
        }

        if (partName === 'sunroof' && currentViewMode === 'exterior') {
            // 외부 썬루프는 필름 타입/농도/없음 선택과 무관하게
            // 항상 현재 비반사 상태와 동일한 고정 재질로 표시한다.
            // Model 3는 외부에서 실내가 덜 보이도록 더 진하게 고정한다.
            // 내부 시점 로직은 아래 interior 분기에서 그대로 유지된다.
            mat.color.setHex(0x030404);
            mat.opacity = currentCarModelKey === 'model_3' ? 0.985 : 0.828;
            mat.metalness = 0.0;
            mat.roughness = 0.12;
            mat.envMapIntensity = 0.08;
            if ('clearcoat' in mat) mat.clearcoat = 0.08;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
        } else if (currentViewMode === 'interior') {
            mat.color.setHex(0x080a0a);
            mat.opacity = opacityValue;
            mat.metalness = 0.0;
            mat.roughness = 0.36;
            mat.envMapIntensity = 0.015;
            if ('clearcoat' in mat) mat.clearcoat = 0.0;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.55;
        } else if (filmType === 'reflective') {
            // 반사 필름은 검은 판처럼 막지 않고 표면 반사로 성격을 표현한다.
            mat.color.setHex(0x070808);
            mat.opacity = getModel3MatchedOpacity(opacityValue, true);
            mat.metalness = 0.02;
            mat.roughness = 0.035;
            mat.envMapIntensity = 0.24;
            if ('clearcoat' in mat) mat.clearcoat = 0.25;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.025;
        } else {
            mat.color.setHex(0x030404);
            // 기존 opacityValue를 그대로 쓰되 조금 약하게
            mat.opacity = getModel3MatchedOpacity(opacityValue, false);
            mat.metalness = 0.0;
            mat.roughness = 0.12;
            mat.envMapIntensity = 0.08;
            if ('clearcoat' in mat) mat.clearcoat = 0.08;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
        }

        // v3: 동적 투명 정렬에서 가까운 창은 이 값 그대로, 반대편 창만 극히 약하게 표시
        mat.userData = Object.assign({}, mat.userData, { baseOpacity: mat.opacity, glassLayer: 'film' });
        mat.needsUpdate = true;
    }

    function updateExteriorGlassLayering() {
        if (!camera || !glassMeshes.length) return;

        // 현재 모델의 좌/우 축은 X. 차량 중심(Orbit target)을 기준으로
        // 카메라가 실제 어느 쪽에 있는지 판단한다. 절대 world X를 쓰면
        // 모델 위치 오프셋 때문에 각도를 조금 바꿀 때 가까운/먼 유리가 뒤집힐 수 있다.
        const dx = camera.position.x - controls.target.x;
        const dz = camera.position.z - controls.target.z;
        const cameraSide = dx >= 0 ? 1 : -1;

        // Model 3을 정면에 가깝게 볼 때는 전면유리 뒤쪽의 측면/후면 진한 유리가
        // 투명 레이어 중첩으로 검은 판처럼 보이지 않도록 뒤쪽 레이어만 약하게 표시한다.
        // 측면이나 후면에서 보는 재질/농도에는 영향을 주지 않는다.
        const model3FrontDominantView =
            currentCarModelKey === 'model_3' &&
            currentViewMode === 'exterior' &&
            dz > 0.20 &&
            Math.abs(dx) < Math.abs(dz) * 0.82;

        glassMeshes.forEach(mesh => {
            if (!mesh || !mesh.material) return;

            const mat = mesh.material;
            const side = mesh.userData.windowSide || mat.userData.windowSide || 0;
            const layer = mesh.userData.glassLayer || mat.userData.glassLayer || '';
            const baseOpacity = mat.userData.baseOpacity;
            if (typeof baseOpacity !== 'number') return;

            // Model 3 정면에서 전면유리를 통해 보이는 후면 상단 고정 진한 유리.
            // 원래 0.828 농도는 그대로 보존하고, 정면 중첩 상황에서만 시각적으로 약하게 만든다.
            if (model3FrontDominantView && mat.userData.isFixedRearOuterTint) {
                mat.opacity = Math.min(baseOpacity * 0.12, 0.10);
                mesh.renderOrder = 8;
                return;
            }

            // Model 3 정면 근처에서도 카메라와 가까운 측면 유리는 선택한 농도를 그대로 유지한다.
            // 전면유리 뒤에 겹치는 반대편 유리만 약하게 해서 검게 뭉치는 현상만 막는다.
            // 이렇게 하면 5%처럼 진한 농도가 카메라 각도를 조금 바꿨을 때 사라지지 않는다.
            if (model3FrontDominantView && side !== 0) {
                const isNearSideInFrontView = side === cameraSide;

                if (isNearSideInFrontView) {
                    mat.opacity = baseOpacity;
                    mesh.renderOrder = layer === 'outer' ? 31 : 30;
                } else if (layer === 'film') {
                    mat.opacity = Math.min(baseOpacity * 0.08, 0.032);
                    mesh.renderOrder = 11;
                } else if (layer === 'outer') {
                    mat.opacity = Math.min(baseOpacity * 0.10, 0.006);
                    mesh.renderOrder = 10;
                } else {
                    mat.opacity = Math.min(baseOpacity * 0.08, 0.032);
                    mesh.renderOrder = 11;
                }
                return;
            }

            // 전면/후면/루프 또는 실내시점은 일반 깊이 정렬을 사용한다.
            if (currentViewMode === 'interior' || side === 0) {
                mat.opacity = baseOpacity;
                mesh.renderOrder = 0;
                return;
            }

            const isNearSide = side === cameraSide;
            if (isNearSide) {
                // 가까운 쪽: 필름을 먼저, 실제 바깥 유리 표면을 마지막에 그린다.
                mat.opacity = baseOpacity;
                mesh.renderOrder = layer === 'outer' ? 31 : 30;
            } else {
                // 반대편 쪽: 실제 차에서 희미하게 보이는 수준만 남긴다.
                // 카메라 각도에 따라 먼 유리가 갑자기 앞에 덮여 검게 되는 현상을 막는다.
                if (layer === 'film') {
                    mat.opacity = Math.min(baseOpacity * 0.08, 0.032);
                    mesh.renderOrder = 11;
                } else if (layer === 'outer') {
                    mat.opacity = Math.min(baseOpacity * 0.10, 0.006);
                    mesh.renderOrder = 10;
                }
            }
        });
    }

    // Model 3의 glass_rear_outertint + glass_roof_panorama 전용 고정 진한 유리.
    // Model Y 썬루프와 같은 화면 재질값을 사용하며 농도 선택과 무관하게 항상 고정한다.
    function applyModel3FixedDarkGlassMaterial(mat) {
        if (!mat) return;

        mat.side = THREE.DoubleSide;
        mat.transparent = true;
        mat.depthTest = true;
        mat.depthWrite = false;
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.alphaTest = 0.0;
        mat.polygonOffset = false;

        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.001;

        if (currentViewMode === 'interior') {
            // Model 3 썬루프는 기본 5% 진하기(0.66)를 항상 유지하고,
            // 선택한 썬루프 농도는 Model Y와 동일한 실내 계산값을 추가로 겹쳐 더 진하게 만든다.
            mat.color.setHex(0x080a0a);

            const isModel3Sunroof = !!(mat.userData && mat.userData.isSunroofGlass);
            if (isModel3Sunroof) {
                const baseRoofOpacity = 0.66; // 현재 5% 고정 기본값
                const selectedRoofTint = glassTintValues.sunroof;

                if (selectedRoofTint == null) {
                    // '없음' = 기본 5% 고정값만 표시
                    mat.opacity = baseRoofOpacity;
                } else {
                    // Model Y 썬루프 실내 계산값과 동일
                    let addedTintOpacity;
                    if (selectedRoofTint >= 70) addedTintOpacity = 0.23;
                    else if (selectedRoofTint >= 50) addedTintOpacity = 0.35;
                    else {
                        let modelYRoofOpacity;
                        if (selectedRoofTint >= 30) modelYRoofOpacity = 0.59;
                        else if (selectedRoofTint >= 22) modelYRoofOpacity = 0.66;
                        else if (selectedRoofTint >= 15) modelYRoofOpacity = 0.72;
                        else modelYRoofOpacity = 0.82; // 5%
                        addedTintOpacity = Math.max(0.42, modelYRoofOpacity - 0.16);
                    }

                    // 기본 5% 유리 + 추가 필름을 실제 두 레이어처럼 합성
                    mat.opacity = 1.0 - ((1.0 - baseRoofOpacity) * (1.0 - addedTintOpacity));
                }
            } else {
                // 후면 고정 진한 유리는 기존 값 그대로
                mat.opacity = 0.66;
            }

            mat.metalness = 0.0;
            mat.roughness = 0.36;
            mat.envMapIntensity = 0.015;
            if ('clearcoat' in mat) mat.clearcoat = 0.0;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.55;
        } else {
            // Model 3의 glass_rear_outertint 와 glass_roof_panorama 는
            // 외부에서 같은 고정 진하기로 보이도록 동일한 재질값을 사용한다.
            mat.color.setHex(0x030404);
            mat.opacity = 0.94;
            mat.metalness = 0.0;
            mat.roughness = 0.12;
            mat.envMapIntensity = 0.08;
            if ('clearcoat' in mat) mat.clearcoat = 0.08;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.12;
        }

        mat.userData = Object.assign({}, mat.userData, {
            baseOpacity: mat.opacity,
            glassLayer: 'fixedDarkGlass',
            isModel3FixedDarkGlass: true
        });
        mat.needsUpdate = true;
    }

    function updateAllGlassMaterials() {
        outerGlassMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyOuterGlassMaterial(mesh.material);
                mesh.visible = true;
            }
        });

        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });

        model3FixedDarkGlassMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyModel3FixedDarkGlassMaterial(mesh.material);
                mesh.visible = true;
                mesh.renderOrder = 29;
            }
        });

        glassBorderMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyGlassBorderMaterial(mesh.material);
                mesh.visible = true;
            }
        });

        updateExteriorGlassLayering();
    }

    function setInteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    function restoreExteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    // 후면 썬팅 농도에 따라 실내 룸미러 반사 밝기를 조절
    function updateRoomMirrorTint() {
        const rearTint = glassTintValues.rear;

        let brightness = 1.0;
        if (rearTint == null) brightness = 1.0;
        else if (rearTint >= 70) brightness = 0.98;
        else if (rearTint >= 50) brightness = 0.94;
        else if (rearTint >= 30) brightness = 0.90;
        else if (rearTint >= 22) brightness = 0.86;
        else if (rearTint >= 15) brightness = 0.82;
        else brightness = 0.75;

        // Model 3은 후면 농도가 진할 때 Model Y보다 룸미러도 조금 더 어둡게 보이게 한다.
        if (currentCarModelKey === 'model_3') {
            if (rearTint == null) brightness = 1.0;
            else if (rearTint >= 70) brightness = 0.97;
            else if (rearTint >= 50) brightness = 0.92;
            else if (rearTint >= 30) brightness = 0.87;
            else if (rearTint >= 22) brightness = 0.81;
            else if (rearTint >= 15) brightness = 0.73;
            else brightness = 0.60;
        }

        roomMirrorMaterials.forEach(mat => {
            if (!mat) return;
            mat.color.setRGB(brightness, brightness, brightness);
            // Model Y와 동일한 반사 강도 기준을 사용한다.
            mat.envMapIntensity = 0.25 * brightness;
            mat.metalness = 1.0;
            mat.roughness = 0.02;
            if ('clearcoat' in mat) mat.clearcoat = 1.0;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.0;
            mat.needsUpdate = true;
        });
    }

    // 룸미러에 HDRI만 비추는 대신 실제 차량 실내/후방 장면을 실시간 반사
    function setupRoomMirrorReflection() {
        if (!roomMirrorMesh || roomMirrorCubeCamera) return;

        roomMirrorRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
            generateMipmaps: true,
            minFilter: THREE.LinearMipmapLinearFilter
        });

        roomMirrorCubeCamera = new THREE.CubeCamera(
            0.05,
            100,
            roomMirrorRenderTarget
        );

        const mirrorPos = new THREE.Vector3();
        roomMirrorMesh.getWorldPosition(mirrorPos);
        roomMirrorCubeCamera.position.copy(mirrorPos);
        scene.add(roomMirrorCubeCamera);

        roomMirrorMaterials.forEach(mat => {
            if (!mat) return;
            mat.envMap = roomMirrorRenderTarget.texture;
            mat.needsUpdate = true;
        });
    }

    const loadingEl = document.getElementById('loading');
    function showLoadingMessage(message) {
        if (loadingEl) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = message;
        }
    }

    function handleModelLoaded(gltf, preservedViewState = null, loadedModelKey = null) {
        try {
            if (currentCarModel) {
                scene.remove(currentCarModel);
                currentCarModel = null;
            }

            if (roomMirrorCubeCamera) {
                scene.remove(roomMirrorCubeCamera);
                roomMirrorCubeCamera = null;
            }
            if (roomMirrorRenderTarget) {
                roomMirrorRenderTarget.dispose();
                roomMirrorRenderTarget = null;
            }
            roomMirrorMesh = null;
            roomMirrorMaterials = [];

            carBodyMaterials = [];
            interiorMaterial = null;
            interiorMaterials = [];
            seatMaterials = [];
            interiorTrimMaterials = [];
            model3InteriorMatteMaterials = [];
            glassMaterials = { front: [], row1: [], row2: [], rear: [], sunroof: [] };
            glassMeshes = [];
            outerGlassMeshes = [];
            model3FixedDarkGlassMeshes = [];
            glassBorderMeshes = [];

            if (loadedModelKey) currentCarModelKey = loadedModelKey;

            const model = gltf.scene;
            const meshesToAdd = [];
            const meshesToHide = [];

            // v2 helper: side outer glass가 좌/우를 한 mesh에 담고 있으면
            // 투명 정렬이 object 중심 하나로 계산되어 반대편 유리가 앞에 덮이는 현상이 생길 수 있다.
            // 삼각형의 world X 중심을 기준으로 좌/우 두 mesh로 런타임 분리한다.
            function splitSideOuterByWorldX(sourceMesh, material, layerName = 'outer') {
                if (!sourceMesh || !sourceMesh.geometry || !sourceMesh.parent) return null;

                sourceMesh.updateMatrixWorld(true);
                const srcGeo = sourceMesh.geometry.index ? sourceMesh.geometry.toNonIndexed() : sourceMesh.geometry.clone();
                const pos = srcGeo.getAttribute('position');
                if (!pos || pos.count < 6) return null;

                const attrNames = Object.keys(srcGeo.attributes);
                const buckets = {
                    left: Object.fromEntries(attrNames.map(n => [n, []])),
                    right: Object.fromEntries(attrNames.map(n => [n, []]))
                };
                let leftTriangles = 0;
                let rightTriangles = 0;
                const c = new THREE.Vector3();

                function pushVertex(bucket, vertexIndex) {
                    attrNames.forEach(name => {
                        const attr = srcGeo.getAttribute(name);
                        const arr = buckets[bucket][name];
                        for (let k = 0; k < attr.itemSize; k++) {
                            arr.push(attr.array[vertexIndex * attr.itemSize + k]);
                        }
                    });
                }

                for (let i = 0; i + 2 < pos.count; i += 3) {
                    c.set(
                        (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3,
                        (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3,
                        (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3
                    ).applyMatrix4(sourceMesh.matrixWorld);
                    const bucket = c.x >= 0 ? 'right' : 'left';
                    pushVertex(bucket, i);
                    pushVertex(bucket, i + 1);
                    pushVertex(bucket, i + 2);
                    if (bucket === 'right') rightTriangles++; else leftTriangles++;
                }

                if (!leftTriangles || !rightTriangles) {
                    srcGeo.dispose();
                    return null;
                }

                function makeHalf(bucket, suffix) {
                    const geo = new THREE.BufferGeometry();
                    attrNames.forEach(name => {
                        const srcAttr = srcGeo.getAttribute(name);
                        const TypedArray = srcAttr.array.constructor;
                        const data = new TypedArray(buckets[bucket][name]);
                        geo.setAttribute(name, new THREE.BufferAttribute(data, srcAttr.itemSize, srcAttr.normalized));
                    });
                    geo.computeBoundingBox();
                    geo.computeBoundingSphere();

                    const half = sourceMesh.clone(false);
                    half.name = sourceMesh.name + suffix;
                    half.geometry = geo;
                    half.material = material.clone();
                    const sideSign = bucket === 'right' ? 1 : -1;
                    half.material.userData = Object.assign({}, material.userData, { windowSide: sideSign, glassLayer: layerName });
                    half.userData = Object.assign({}, half.userData, { windowSide: sideSign, glassLayer: layerName });
                    half.material.side = THREE.DoubleSide;
                    half.renderOrder = 0;
                    return half;
                }

                const leftMesh = makeHalf('left', '_L_runtime');
                const rightMesh = makeHalf('right', '_R_runtime');
                srcGeo.dispose();
                return [leftMesh, rightMesh];
            }

            // 현재 Model 3 GLB에는 Model Y처럼 MIRROR라는 별도 재질이 없다.
            // 실제 룸미러 반사면은 Geohoodsub00031Mtl(Object_26) 안에 다른 부품과 합쳐져 있으므로
            // 룸미러 위치의 삼각형만 분리해서 실시간 반사 전용 레이어로 만든다.
            function createModel3RoomMirrorOverlay(sourceMesh) {
                if (!sourceMesh || !sourceMesh.geometry || !sourceMesh.parent) return null;

                sourceMesh.updateMatrixWorld(true);
                const srcGeo = sourceMesh.geometry.index ? sourceMesh.geometry.toNonIndexed() : sourceMesh.geometry.clone();
                const pos = srcGeo.getAttribute('position');
                const normal = srcGeo.getAttribute('normal');
                if (!pos || pos.count < 6) {
                    srcGeo.dispose();
                    return null;
                }

                const positions = [];
                const normals = [];
                const c = new THREE.Vector3();

                // mo3.glb 실제 룸미러 면의 world 영역.
                // 다른 차체/후드 삼각형은 이 영역에 들어오지 않는다.
                function isRoomMirrorTriangle(worldCenter) {
                    return worldCenter.x > -0.105 && worldCenter.x < 0.125 &&
                           worldCenter.y > 1.365 && worldCenter.y < 1.445 &&
                           worldCenter.z > 0.400 && worldCenter.z < 0.485;
                }

                for (let i = 0; i + 2 < pos.count; i += 3) {
                    c.set(
                        (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3,
                        (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3,
                        (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3
                    ).applyMatrix4(sourceMesh.matrixWorld);

                    if (!isRoomMirrorTriangle(c)) continue;

                    for (let v = i; v < i + 3; v++) {
                        positions.push(pos.getX(v), pos.getY(v), pos.getZ(v));
                        if (normal) {
                            normals.push(normal.getX(v), normal.getY(v), normal.getZ(v));
                        }
                    }
                }

                if (!positions.length) {
                    srcGeo.dispose();
                    return null;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                if (normals.length === positions.length) {
                    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                } else {
                    geo.computeVertexNormals();
                }
                geo.computeBoundingBox();
                geo.computeBoundingSphere();

                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 1.0,
                    roughness: 0.02,
                    side: THREE.DoubleSide,
                    transparent: false,
                    depthTest: true,
                    depthWrite: true,
                    polygonOffset: true,
                    polygonOffsetFactor: -3.0,
                    polygonOffsetUnits: -3.0
                });
                mat.envMapIntensity = 0.25;

                const overlay = new THREE.Mesh(geo, mat);
                overlay.name = 'model3_room_mirror_reflection_overlay';
                overlay.renderOrder = 80;
                overlay.frustumCulled = false;
                overlay.userData = Object.assign({}, overlay.userData, { isModel3RoomMirrorOverlay: true });

                sourceMesh.parent.add(overlay);
                roomMirrorMesh = overlay;
                roomMirrorMaterials.push(mat);

                srcGeo.dispose();
                return overlay;
            }

            // Model 3 도어 손잡이는 차체 표면과 거의 같은 깊이에 있어
            // 멀리서 depth 정밀도가 떨어지면 차체 뒤로 묻히거나 조각나 보일 수 있다.
            // Geodoorl2sub11Mtl 중 실제 손잡이 삼각형만 따로 복제해 약간 앞쪽 depth로 렌더링한다.
            function createModel3DoorHandleOverlays(sourceMesh) {
                if (!sourceMesh || !sourceMesh.geometry || !sourceMesh.parent) return [];

                sourceMesh.updateMatrixWorld(true);
                const srcGeo = sourceMesh.geometry.index ? sourceMesh.geometry.toNonIndexed() : sourceMesh.geometry.clone();
                const pos = srcGeo.getAttribute('position');
                if (!pos || pos.count < 6) {
                    srcGeo.dispose();
                    return [];
                }

                const buckets = { frontLeft: [], frontRight: [], rearLeft: [], rearRight: [] };
                const c = new THREE.Vector3();

                function classifyDoorHandleTriangle(worldCenter) {
                    const ax = Math.abs(worldCenter.x);

                    const isFrontHandle =
                        ax > 0.84 && ax < 0.92 &&
                        worldCenter.y > 0.985 && worldCenter.y < 1.075 &&
                        worldCenter.z > -0.055 && worldCenter.z < 0.185;

                    const isRearHandle =
                        ax > 0.735 && ax < 0.835 &&
                        worldCenter.y > 1.055 && worldCenter.y < 1.145 &&
                        worldCenter.z > 0.900 && worldCenter.z < 1.050;

                    if (!isFrontHandle && !isRearHandle) return null;

                    const sideKey = worldCenter.x >= 0 ? 'Right' : 'Left';
                    return (isRearHandle ? 'rear' : 'front') + sideKey;
                }

                for (let i = 0; i + 2 < pos.count; i += 3) {
                    c.set(
                        (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3,
                        (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3,
                        (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3
                    ).applyMatrix4(sourceMesh.matrixWorld);

                    const bucketKey = classifyDoorHandleTriangle(c);
                    if (!bucketKey) continue;
                    const bucket = buckets[bucketKey];
                    for (let v = i; v < i + 3; v++) {
                        bucket.push(pos.getX(v), pos.getY(v), pos.getZ(v));
                    }
                }

                const result = [];
                function makeOverlay(points, suffix, isRear) {
                    if (!points.length) return;

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
                    geo.computeVertexNormals();

                    // Model 3 뒷문 손잡이는 차체와 거의 같은 깊이라 카메라 각도가 바뀌면
                    // depth 정밀도 때문에 묻는 현상이 있어, 면을 아주 미세하게 바깥으로 밀어준다.
                    const posAttr = geo.getAttribute('position');
                    const normalAttr = geo.getAttribute('normal');
                    const push = isRear ? 0.0022 : 0.0012;
                    if (posAttr && normalAttr && posAttr.count === normalAttr.count) {
                        for (let i = 0; i < posAttr.count; i++) {
                            posAttr.setXYZ(
                                i,
                                posAttr.getX(i) + normalAttr.getX(i) * push,
                                posAttr.getY(i) + normalAttr.getY(i) * push,
                                posAttr.getZ(i) + normalAttr.getZ(i) * push
                            );
                        }
                        posAttr.needsUpdate = true;
                    }

                    geo.computeBoundingBox();
                    geo.computeBoundingSphere();

                    const mat = new THREE.MeshStandardMaterial({
                        color: 0x0b0b0b,
                        metalness: 0.12,
                        roughness: 0.34,
                        side: THREE.DoubleSide,
                        depthTest: true,
                        depthWrite: !isRear,
                        polygonOffset: true,
                        polygonOffsetFactor: isRear ? -24.0 : -12.0,
                        polygonOffsetUnits: isRear ? -24.0 : -12.0
                    });

                    const overlay = new THREE.Mesh(geo, mat);
                    overlay.name = 'model3_door_handle_overlay_' + suffix;
                    overlay.renderOrder = isRear ? 72 : 60;
                    overlay.frustumCulled = false;
                    overlay.userData = Object.assign({}, overlay.userData, {
                        isModel3DoorHandleOverlay: true,
                        isRearDoorHandleOverlay: !!isRear
                    });
                    sourceMesh.parent.add(overlay);
                    result.push(overlay);
                }

                makeOverlay(buckets.frontLeft, 'front_L', false);
                makeOverlay(buckets.frontRight, 'front_R', false);
                makeOverlay(buckets.rearLeft, 'rear_L', true);
                makeOverlay(buckets.rearRight, 'rear_R', true);
                srcGeo.dispose();
                return result;
            }

            // Model 3 전조등/방향지시등 일부가 시트와 같은 Ln7Mtl 재질을 공유한다.
            // 원본 GLB의 로컬 X 좌표 기준으로 전면 램프 영역(X >= 0)만 분리해
            // 실내색상 변경과 무관하게 항상 검정색으로 유지한다.
            function splitModel3SeatAndIndicator(sourceMesh) {
                if (!sourceMesh || !sourceMesh.geometry || !sourceMesh.parent) return null;

                const srcGeo = sourceMesh.geometry.index ? sourceMesh.geometry.toNonIndexed() : sourceMesh.geometry.clone();
                const pos = srcGeo.getAttribute('position');
                if (!pos || pos.count < 6) {
                    srcGeo.dispose();
                    return null;
                }

                const attrNames = Object.keys(srcGeo.attributes);
                const buckets = {
                    seat: Object.fromEntries(attrNames.map(n => [n, []])),
                    indicator: Object.fromEntries(attrNames.map(n => [n, []]))
                };
                let seatTriangles = 0;
                let indicatorTriangles = 0;

                function pushVertex(bucket, vertexIndex) {
                    attrNames.forEach(name => {
                        const attr = srcGeo.getAttribute(name);
                        const arr = buckets[bucket][name];
                        for (let k = 0; k < attr.itemSize; k++) {
                            arr.push(attr.array[vertexIndex * attr.itemSize + k]);
                        }
                    });
                }

                for (let i = 0; i + 2 < pos.count; i += 3) {
                    const centerX = (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3;
                    const bucket = centerX >= 0 ? 'indicator' : 'seat';
                    pushVertex(bucket, i);
                    pushVertex(bucket, i + 1);
                    pushVertex(bucket, i + 2);
                    if (bucket === 'indicator') indicatorTriangles++; else seatTriangles++;
                }

                if (!seatTriangles || !indicatorTriangles) {
                    srcGeo.dispose();
                    return null;
                }

                function makePart(bucket, suffix, material) {
                    const geo = new THREE.BufferGeometry();
                    attrNames.forEach(name => {
                        const srcAttr = srcGeo.getAttribute(name);
                        const TypedArray = srcAttr.array.constructor;
                        const data = new TypedArray(buckets[bucket][name]);
                        geo.setAttribute(name, new THREE.BufferAttribute(data, srcAttr.itemSize, srcAttr.normalized));
                    });
                    geo.computeBoundingBox();
                    geo.computeBoundingSphere();

                    const mesh = sourceMesh.clone(false);
                    mesh.name = sourceMesh.name + suffix;
                    mesh.geometry = geo;
                    mesh.material = material;
                    return mesh;
                }

                const seatMat = sourceMesh.material.clone();
                seatMat.userData = Object.assign({}, seatMat.userData, { isModel3Seat: true });

                const indicatorMat = sourceMesh.material.clone();
                indicatorMat.name = 'Model3_Indicator_Black_Fixed';
                indicatorMat.color.setHex(0x050505);
                indicatorMat.needsUpdate = true;
                indicatorMat.userData = Object.assign({}, indicatorMat.userData, { isModel3IndicatorFixedBlack: true });

                const seatMesh = makePart('seat', '_seat_runtime', seatMat);
                const indicatorMesh = makePart('indicator', '_indicator_black_runtime', indicatorMat);

                srcGeo.dispose();
                return { seatMesh, indicatorMesh, seatMat, indicatorMat };
            }

            model.updateMatrixWorld(true);

            model.traverse((child) => {
                if (!(child.isMesh && child.material)) return;

                const rawMatName = child.material.name || '';
                const matName = rawMatName.toLowerCase();
                const meshName = (child.name || '').toLowerCase();

                // Model 3의 천장/필러/대시 상단/도어 패널에 공유된 두 재질만 별도 추적한다.
                // 외부 모습에는 영향이 없도록 실내 시점에서만 무광 처리한다.
                if (matName === 'georimblurlfsub01mtl' || matName === 'georimblurlfsub021mtl') {
                    const model3TrimMat = child.material.clone();
                    child.material = model3TrimMat;
                    registerModel3InteriorMatteMaterial(model3TrimMat);
                }

// Model 3: Blender에서 별도로 분리해 이름을 Rearviewmirror로 지정한 실제 룸미러.
// 재질명과 무관하게 오브젝트 이름으로 정확히 인식해서 Model Y와 같은 실시간 반사를 적용한다.
if (currentCarModelKey === 'model_3' && meshName === 'rearviewmirror') {
    const rearviewMat = child.material.clone();
    rearviewMat.color.setHex(0xffffff);
    rearviewMat.metalness = 1.0;
    rearviewMat.roughness = 0.02;
    rearviewMat.envMapIntensity = 0.25;
    rearviewMat.side = THREE.DoubleSide;
    rearviewMat.transparent = false;
    rearviewMat.depthTest = true;
    rearviewMat.depthWrite = true;

    if ('clearcoat' in rearviewMat) rearviewMat.clearcoat = 1.0;
    if ('clearcoatRoughness' in rearviewMat) rearviewMat.clearcoatRoughness = 0.0;

    rearviewMat.needsUpdate = true;
    child.material = rearviewMat;
    child.frustumCulled = false;

    roomMirrorMaterials.push(rearviewMat);
    roomMirrorMesh = child;
}

// 사이드미러 거울 재질
if (matName === 'mirror') {
    const mirrorMat = child.material.clone();

    mirrorMat.color.setHex(0xffffff);
    mirrorMat.metalness = 1.0;
    mirrorMat.roughness = 0.02;
    mirrorMat.envMapIntensity = 1.5;

    if ('clearcoat' in mirrorMat) {
        mirrorMat.clearcoat = 1.0;
    }

    if ('clearcoatRoughness' in mirrorMat) {
        mirrorMat.clearcoatRoughness = 0.0;
    }
